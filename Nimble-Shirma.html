<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimble — ширма мастера</title>
<meta name="description" content="Ширма мастера для Nimble RPG: персонажи, броски, справочник, бестиарий, трекер боя, напоминания и заметки.">
<style>:root {
  --bg: #12100e;
  --bg-2: #17130f;
  --panel: #1d1815;
  --panel-2: #241d19;
  --panel-3: #2b231e;
  --line: rgba(243, 223, 194, .10);
  --line-strong: rgba(243, 223, 194, .20);
  --ink: #f3e9da;
  --ink-2: #d9cbb8;
  --muted: #a4937f;
  --dim: #7d6d5c;
  --amber: #e0a45f;
  --amber-soft: #f0c38c;
  --amber-dim: rgba(224, 164, 95, .14);
  --ember: #c9683d;
  --green: #93b173;
  --red: #d96a5f;
  --blue: #83a9c9;
  --violet: #a990c9;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 18px 40px -24px rgba(0, 0, 0, .9);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(201, 104, 61, .16), transparent 60%),
    radial-gradient(900px 500px at 92% 0%, rgba(224, 164, 95, .10), transparent 55%),
    linear-gradient(180deg, var(--bg-2), var(--bg) 40%);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .014) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .010) 0 1px, transparent 1px 4px);
  z-index: 0;
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
svg.sprite { display: none; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--amber-soft); }
::selection { background: rgba(224, 164, 95, .30); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 12px clamp(14px, 3vw, 34px);
  background: rgba(18, 16, 14, .82);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; color: var(--amber); flex: 0 0 auto; }
.brand-mark svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.4; }
.brand-mark svg path:last-child { fill: rgba(224, 164, 95, .16); }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text strong { font: 600 17px/1 var(--serif); letter-spacing: .02em; }
.brand-text em { font-style: normal; font-size: 10.5px; letter-spacing: .17em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

.search-trigger {
  display: flex; align-items: center; gap: 10px;
  flex: 1 1 420px; max-width: 640px;
  padding: 9px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  color: var(--muted); text-align: left;
  transition: border-color .16s, background .16s;
}
.search-trigger:hover { border-color: var(--line-strong); background: var(--panel-2); color: var(--ink-2); }
.search-trigger span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.search-trigger kbd, .palette-input kbd {
  font: 11px/1 var(--mono); color: var(--dim);
  border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px;
}
.top-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }

/* ---------- Tabs ---------- */
.tabs {
  display: flex; gap: 2px;
  padding: 0 clamp(10px, 3vw, 30px);
  border-bottom: 1px solid var(--line);
  background: rgba(23, 19, 15, .5);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 13px 13px 12px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted); font-size: 13.5px; white-space: nowrap;
}
.tab .ico { width: 16px; height: 16px; }
.tab:hover { color: var(--ink-2); }
.tab.is-active { color: var(--ink); border-bottom-color: var(--amber); }
.tab.is-active .ico { color: var(--amber); }
.tab-badge {
  min-width: 17px; height: 17px; padding: 0 5px;
  display: inline-grid; place-items: center;
  font: 10.5px/1 var(--mono); color: #22180f;
  background: var(--amber); border-radius: 999px;
}

/* ---------- Layout ---------- */
.view { flex: 1; width: 100%; max-width: 1480px; margin: 0 auto; padding: clamp(16px, 2.4vw, 30px) clamp(14px, 3vw, 34px) 40px; }
.page-head { display: flex; align-items: flex-end; gap: 18px; margin: 0 0 20px; flex-wrap: wrap; }
.page-head .eyebrow { font: 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); margin: 0 0 7px; }
.page-title { font: 600 clamp(24px, 3vw, 33px)/1.05 var(--serif); margin: 0; letter-spacing: -.01em; }
.page-sub { margin: 7px 0 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.head-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.grid { display: grid; gap: 14px; }
.grid-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.col-3 { grid-column: span 3; }
.col-4 { grid-column: span 4; }
.col-5 { grid-column: span 5; }
.col-6 { grid-column: span 6; }
.col-7 { grid-column: span 7; }
.col-8 { grid-column: span 8; }
.col-12 { grid-column: span 12; }

.card {
  background: linear-gradient(180deg, rgba(255, 255, 255, .018), transparent 60%), var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-head { display: flex; align-items: center; gap: 10px; padding: 13px 15px 11px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font: 600 14.5px/1.2 var(--sans); margin: 0; letter-spacing: .01em; }
.card-head .count { font: 11.5px/1 var(--mono); color: var(--dim); }
.card-body { padding: 14px 15px 16px; }
.card-link { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 0; }
.card-link:hover { color: var(--amber); }
.card-link .ico { width: 13px; height: 13px; }
.card-flush .card-body { padding: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 34px; padding: 0 13px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
  color: var(--ink-2); font-size: 13px; font-weight: 500;
  transition: background .15s, border-color .15s, color .15s, transform .08s;
}
.btn:hover { background: var(--panel-3); border-color: var(--line-strong); color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn .ico { width: 16px; height: 16px; }
.btn-primary { background: linear-gradient(180deg, #e9b273, var(--amber)); border-color: #b8813f; color: #241a10; font-weight: 600; }
.btn-primary:hover { background: linear-gradient(180deg, #f2c089, #e5aa65); color: #1d140c; }
.btn-ghost { background: transparent; }
.btn-quiet { background: rgba(255, 255, 255, .02); }
.btn-danger { color: #f0b3ad; border-color: rgba(217, 106, 95, .35); }
.btn-danger:hover { background: rgba(217, 106, 95, .12); }
.btn-sm { min-height: 28px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn-lg { min-height: 40px; padding: 0 18px; font-size: 14px; }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  background: transparent; border: 1px solid transparent; border-radius: 9px; color: var(--muted);
}
.icon-btn:hover { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
.icon-btn.sm { width: 27px; height: 27px; }
.icon-btn.sm .ico { width: 14px; height: 14px; }
.icon-btn.danger:hover { color: var(--red); border-color: rgba(217, 106, 95, .3); }

/* ---------- Chips, tags ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 29px; padding: 0 10px;
  background: rgba(255, 255, 255, .022); border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); font-size: 12px; white-space: nowrap;
}
.chip:hover { color: var(--ink); border-color: var(--line-strong); }
.chip.is-active { background: var(--amber-dim); border-color: rgba(224, 164, 95, .45); color: var(--amber-soft); }
.chip .n { font: 10.5px/1 var(--mono); color: var(--dim); }
.chip.is-active .n { color: var(--amber); }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: 6px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid var(--line);
  font-size: 11px; color: var(--muted); white-space: nowrap;
}
.tag.amber { color: var(--amber-soft); border-color: rgba(224, 164, 95, .3); background: var(--amber-dim); }
.tag.red { color: #efb0a9; border-color: rgba(217, 106, 95, .3); background: rgba(217, 106, 95, .10); }
.tag.green { color: #c1d9a8; border-color: rgba(147, 177, 115, .3); background: rgba(147, 177, 115, .10); }
.tag.blue { color: #b0cbe2; border-color: rgba(131, 169, 201, .3); background: rgba(131, 169, 201, .10); }
.tag.violet { color: #cebde4; border-color: rgba(169, 144, 201, .3); background: rgba(169, 144, 201, .10); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field-label { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.input, input[type="text"], input[type="search"], input[type="number"], input[type="datetime-local"], select, textarea {
  width: 100%; min-height: 36px; padding: 7px 10px;
  background: rgba(0, 0, 0, .22); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); font-size: 13.5px;
  transition: border-color .15s, background .15s;
}
textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
input:hover, select:hover, textarea:hover { border-color: var(--line-strong); }
input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(224, 164, 95, .55); background: rgba(0, 0, 0, .3); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field-row > .field { flex: 1 1 130px; }
.hint { font-size: 11.5px; color: var(--dim); margin: 4px 0 0; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--amber); }
input[type="radio"] { accent-color: var(--amber); }

.searchbar { position: relative; display: flex; align-items: center; }
.searchbar .ico { position: absolute; left: 11px; color: var(--dim); width: 16px; height: 16px; pointer-events: none; }
.searchbar input { padding-left: 35px; }
.searchbar .clear { position: absolute; right: 6px; }

/* ---------- Dashboard ---------- */
.hero {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 18px 20px; margin-bottom: 14px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background:
    radial-gradient(600px 140px at 6% 0%, rgba(224, 164, 95, .16), transparent 70%),
    linear-gradient(100deg, #221a15, #1a1512);
}
.hero h1 { font: 600 24px/1.1 var(--serif); margin: 0; }
.hero p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.hero-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.party-row { display: flex; align-items: center; gap: 11px; padding: 10px 15px; border-bottom: 1px solid var(--line); }
.party-row:last-child { border-bottom: 0; }
.avatar {
  width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--panel-3); border: 1px solid var(--line);
  font: 600 13px/1 var(--serif); color: var(--amber-soft);
}
.party-main { flex: 1; min-width: 0; }
.party-name { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
.party-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.party-name span { color: var(--dim); font-size: 11.5px; white-space: nowrap; }
.party-stats { display: flex; gap: 10px; align-items: center; margin-top: 5px; font: 11px/1 var(--mono); color: var(--muted); }
.hp-bar { position: relative; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .07); overflow: hidden; margin-top: 6px; }
.hp-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7d9c5d, #a6c47f); border-radius: 99px; transition: width .3s; }
.hp-fill.warn { background: linear-gradient(90deg, #c08a3f, #e0a45f); }
.hp-fill.crit { background: linear-gradient(90deg, #a94b42, #d96a5f); }
.hp-fill.mana { background: linear-gradient(90deg, #4f7396, #83a9c9); }

.quick-rolls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.qroll {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 9px 5px 8px; border-radius: 9px;
  background: rgba(255, 255, 255, .025); border: 1px solid var(--line);
  color: var(--ink-2);
}
.qroll:hover { border-color: rgba(224, 164, 95, .45); background: var(--amber-dim); color: var(--ink); }
.qroll b { font: 600 14px/1 var(--sans); }
.qroll span { font: 10px/1 var(--mono); color: var(--dim); letter-spacing: .06em; }

.dash-list { display: flex; flex-direction: column; }
.dash-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 15px; border-bottom: 1px solid var(--line); font-size: 13px; }
.dash-item:last-child { border-bottom: 0; }
.dash-item .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); margin-top: 8px; flex: 0 0 auto; }
.dash-item time { margin-left: auto; color: var(--dim); font: 10.5px/1.6 var(--mono); white-space: nowrap; }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 26px 18px; color: var(--muted); }
.empty .ico { width: 26px; height: 26px; color: var(--dim); margin-bottom: 8px; }
.empty p { margin: 0 0 10px; font-size: 13px; }
.empty .btn { margin-top: 2px; }

/* ---------- Character cards ---------- */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.char-card { position: relative; padding: 15px; }
.char-card .top { display: flex; gap: 11px; align-items: flex-start; }
.char-card h3 { margin: 0; font: 600 17px/1.15 var(--serif); }
.char-card .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
.char-card .res { display: flex; gap: 14px; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
.char-card .res b { font: 600 15px/1 var(--mono); color: var(--ink); }
.char-card .char-note { margin: 9px 0 0; color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.char-actions { display: flex; gap: 6px; margin-top: 12px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat {
  position: relative; padding: 9px 8px 8px; border-radius: 10px; text-align: center;
  background: rgba(255, 255, 255, .022); border: 1px solid var(--line);
}
.stat .k { font: 10.5px/1 var(--mono); letter-spacing: .1em; color: var(--dim); }
.stat .v { font: 600 21px/1.15 var(--mono); color: var(--ink); margin: 3px 0 2px; }
.stat .roll { font-size: 10px; color: var(--dim); }
button.stat { cursor: pointer; width: 100%; }
button.stat:hover { border-color: rgba(224, 164, 95, .45); background: var(--amber-dim); }

.sheet-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 14px; align-items: start; }
.sheet-block { margin-bottom: 12px; }
.sheet-block:last-child { margin-bottom: 0; }
.sheet-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font: 600 13px/1.2 var(--sans); color: var(--ink-2); }
.sheet-h .line { flex: 1; height: 1px; background: var(--line); }

.skill-line { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; font-size: 12.5px; }
.skill-line:hover { background: rgba(255, 255, 255, .03); }
.skill-line .nm { flex: 1; }
.skill-line .st { font: 10.5px/1 var(--mono); color: var(--dim); }
.skill-line .pts { font: 12px/1 var(--mono); color: var(--amber-soft); min-width: 18px; text-align: right; }
.skill-line button { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 3px 5px; }

.track { display: flex; align-items: center; gap: 5px; }
.track .box { flex: 1; display: flex; gap: 4px; }
.pip { flex: 1; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255, 255, 255, .025); }
.pip.on { background: linear-gradient(180deg, #c98852, #a8663a); border-color: #8f542f; }
.pip.wound.on { background: linear-gradient(180deg, #d96a5f, #a94b42); border-color: #8c3b34; }
.pip.mana.on { background: linear-gradient(180deg, #83a9c9, #4f7396); border-color: #3e6280; }

.hp-edit { display: flex; align-items: center; gap: 6px; }
.hp-edit input { width: 74px; text-align: center; font-family: var(--mono); }
.hp-big { font: 600 30px/1 var(--mono); letter-spacing: -.02em; }
.hp-big small { font-size: 13px; color: var(--dim); }

.weapon-line { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.weapon-line:last-child { border-bottom: 0; }
.weapon-line .dmg { font: 12px/1 var(--mono); color: var(--amber-soft); white-space: nowrap; }
.weapon-line .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Dice ---------- */
.dice-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; align-items: start; }
.dice-tray { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.die-btn {
  padding: 11px 4px 9px; border-radius: 10px;
  background: rgba(255, 255, 255, .025); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.die-btn b { font: 600 16px/1 var(--mono); }
.die-btn span { font: 10px/1 var(--sans); color: var(--dim); }
.die-btn:hover { border-color: rgba(224, 164, 95, .5); background: var(--amber-dim); }
.die-btn.is-chosen { border-color: var(--amber); background: var(--amber-dim); color: var(--amber-soft); }

.dice-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 12px; }
.dice-row .field { flex: 0 1 90px; }
.dice-row .field.grow { flex: 1 1 180px; }
.adv-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.adv-toggle button { background: transparent; border: 0; padding: 8px 10px; color: var(--muted); font-size: 12px; }
.adv-toggle button + button { border-left: 1px solid var(--line); }
.adv-toggle button.on { background: var(--amber-dim); color: var(--amber-soft); }

.roll-result { margin-top: 14px; padding: 14px; border-radius: 11px; border: 1px solid var(--line); background: rgba(0, 0, 0, .18); }
.roll-result .total { font: 600 38px/1 var(--mono); letter-spacing: -.03em; }
.roll-result .total.crit { color: var(--amber); }
.roll-result .total.miss { color: var(--red); }
.roll-result .detail { color: var(--muted); font: 12px/1.6 var(--mono); margin-top: 6px; word-break: break-word; }
.roll-result .verdict { margin-top: 7px; font-size: 12.5px; }
.roll-result .verdict b { color: var(--amber-soft); }

.rolls { display: flex; flex-direction: column; }
.roll-item { display: flex; align-items: baseline; gap: 9px; padding: 8px 15px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.roll-item:last-child { border-bottom: 0; }
.roll-item .t { color: var(--dim); font: 10px/1.4 var(--mono); white-space: nowrap; }
.roll-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.roll-item .val { font: 600 14px/1 var(--mono); color: var(--ink); }
.roll-item .val.crit { color: var(--amber); }

/* ---------- Reference ---------- */
.ref-layout { display: grid; grid-template-columns: 340px 1fr; gap: 14px; align-items: start; }
.ref-list { max-height: calc(100vh - 250px); overflow: auto; }
.ref-row {
  display: flex; gap: 9px; align-items: flex-start; width: 100%;
  padding: 10px 13px; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left;
}
.ref-row:hover { background: rgba(255, 255, 255, .03); }
.ref-row.is-active { background: var(--amber-dim); box-shadow: inset 2px 0 0 var(--amber); }
.ref-row .nm { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.ref-row .sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
.ref-row .ty { margin-left: auto; font: 9.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding-top: 4px; white-space: nowrap; }

.entry h2 { font: 600 25px/1.12 var(--serif); margin: 0 0 4px; }
.entry .entry-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 13px; }
.entry .lede { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.entry h3 { font: 600 13px/1.2 var(--sans); margin: 17px 0 7px; color: var(--amber-soft); letter-spacing: .03em; }
.entry p { margin: 0 0 9px; font-size: 13.5px; color: var(--ink-2); }
.entry ul { margin: 0 0 10px; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
.entry li { margin: 3px 0; }
.entry .kv { display: grid; grid-template-columns: 118px 1fr; gap: 5px 12px; font-size: 13px; }
.entry .kv dt { color: var(--dim); }
.entry .kv dd { margin: 0; }
.entry .action { padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.entry .action:last-child { border-bottom: 0; }
.entry .action b { color: var(--ink); }
.entry .action .d { color: var(--ink-2); }
.entry .statline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.entry .quote { padding: 9px 12px; border-left: 2px solid rgba(224, 164, 95, .45); background: rgba(224, 164, 95, .05); color: var(--ink-2); font-size: 12.5px; }

/* ---------- Combat ---------- */
.combat-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 15px; border-bottom: 1px solid var(--line); }
.round { display: flex; align-items: baseline; gap: 7px; }
.round b { font: 600 20px/1 var(--mono); }
.round span { font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.combat-list { display: flex; flex-direction: column; }
.combatant {
  position: relative; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px;
  padding: 11px 15px; border-bottom: 1px solid var(--line);
}
.combatant:last-child { border-bottom: 0; }
.combatant.is-current { background: linear-gradient(90deg, rgba(224, 164, 95, .13), transparent 55%); box-shadow: inset 2px 0 0 var(--amber); }
.combatant.is-down { opacity: .55; }
.init {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  background: rgba(0, 0, 0, .25); border: 1px solid var(--line);
  font: 600 17px/1 var(--mono); color: var(--ink-2);
}
.is-current .init { background: var(--amber); border-color: #b8813f; color: #241a10; }
.cname { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 14px; }
.cname b { font-weight: 600; }
.cname .lvl { font: 10.5px/1 var(--mono); color: var(--dim); }
.cstats { display: flex; align-items: center; gap: 9px; margin-top: 3px; font: 11px/1 var(--mono); color: var(--muted); flex-wrap: wrap; }
.cstats .armor { color: var(--blue); }
.combatant .cbar { max-width: 290px; margin-top: 6px; }
.conds { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cond-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; border-radius: 5px; font-size: 10.5px;
  background: rgba(217, 106, 95, .14); border: 1px solid rgba(217, 106, 95, .25); color: #efb0a9;
  cursor: pointer;
}
.cond-chip:hover { background: rgba(217, 106, 95, .25); }
.cond-chip::after { content: "×"; opacity: .6; }
.cside { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hp-quick { display: flex; align-items: center; gap: 4px; }
.hp-quick input { width: 58px; min-height: 30px; text-align: center; font-family: var(--mono); }
.actions-pips { display: flex; gap: 3px; }
.apip { width: 16px; height: 8px; border-radius: 3px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); }
.apip.on { background: var(--amber); border-color: #b8813f; }

.combat-empty { padding: 30px 20px; text-align: center; }
.combat-empty p { color: var(--muted); max-width: 46ch; margin: 0 auto 14px; font-size: 13px; }
.combat-setup { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------- Reminders ---------- */
.rem-layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; align-items: start; }
.rem-list { display: flex; flex-direction: column; }
.reminder {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 12px 15px; border-bottom: 1px solid var(--line);
}
.reminder:last-child { border-bottom: 0; }
.reminder.overdue { background: rgba(217, 106, 95, .06); }
.reminder.done { opacity: .45; }
.rem-check { width: 18px; height: 18px; margin-top: 2px; border: 1px solid var(--line-strong); border-radius: 5px; background: transparent; display: grid; place-items: center; flex: 0 0 auto; }
.rem-check:hover { border-color: var(--amber); }
.rem-check .ico { width: 11px; height: 11px; color: var(--amber); opacity: 0; }
.reminder.done .rem-check .ico { opacity: 1; }
.rem-main { flex: 1; min-width: 0; }
.rem-text { font-size: 13.5px; }
.reminder.done .rem-text { text-decoration: line-through; }
.rem-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font: 10.5px/1.4 var(--mono); color: var(--dim); }
.rem-time { color: var(--amber-soft); }
.rem-time.overdue { color: var(--red); }
.rem-actions { display: flex; gap: 2px; }
.rem-actions .icon-btn { width: 26px; height: 26px; }
.rem-actions .ico { width: 13px; height: 13px; }
.rem-form { display: flex; flex-direction: column; gap: 10px; }

/* ---------- Notes ---------- */
.notes-layout { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
.notes-side { display: flex; flex-direction: column; max-height: calc(100vh - 230px); }
.notes-search { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.notes-list { overflow: auto; }
.note-item { display: block; width: 100%; text-align: left; padding: 10px 13px; border: 0; border-bottom: 1px solid var(--line); background: none; }
.note-item:hover { background: rgba(255, 255, 255, .03); }
.note-item.is-active { background: var(--amber-dim); box-shadow: inset 2px 0 0 var(--amber); }
.note-item b { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item span { display: block; font-size: 11px; color: var(--dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item time { display: block; font: 10px/1.4 var(--mono); color: var(--dim); margin-top: 4px; }

.editor { display: flex; flex-direction: column; min-height: 440px; }
.editor-head { display: flex; gap: 8px; align-items: center; padding: 11px 13px; border-bottom: 1px solid var(--line); }
.editor-title { flex: 1; background: none; border: 0; font: 600 20px/1.2 var(--serif); color: var(--ink); padding: 2px 0; min-height: 30px; }
.editor-title:focus { outline: none; }
.editor-tools { display: flex; flex-wrap: wrap; gap: 2px; padding: 7px 9px; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .14); }
.tool {
  min-width: 30px; height: 28px; padding: 0 7px; border-radius: 6px;
  background: transparent; border: 1px solid transparent; color: var(--muted);
  display: inline-grid; place-items: center; font-size: 12.5px;
}
.tool:hover { background: var(--panel-3); color: var(--ink); border-color: var(--line); }
.tool b, .tool i, .tool u { pointer-events: none; }
.tool-sep { width: 1px; height: 18px; background: var(--line); margin: 5px 4px; }
.note-body {
  flex: 1; min-height: 340px; padding: 16px 18px;
  font-size: 14px; line-height: 1.7; color: var(--ink-2);
  outline: none; overflow-wrap: break-word;
}
.note-body:empty::before { content: attr(data-placeholder); color: var(--dim); }
.note-body h1, .note-body h2, .note-body h3 { font-family: var(--serif); color: var(--ink); margin: .8em 0 .35em; line-height: 1.2; }
.note-body h1 { font-size: 24px; } .note-body h2 { font-size: 19px; } .note-body h3 { font-size: 16px; }
.note-body p { margin: 0 0 .65em; }
.note-body ul, .note-body ol { margin: 0 0 .8em; padding-left: 22px; }
.note-body blockquote { margin: .6em 0; padding: 6px 12px; border-left: 2px solid rgba(224, 164, 95, .5); background: rgba(224, 164, 95, .05); color: var(--muted); }
.note-body b, .note-body strong { color: var(--ink); }
.note-body a { color: var(--amber-soft); }
.editor-foot { display: flex; gap: 10px; align-items: center; padding: 8px 13px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
.editor-foot .saved { margin-left: auto; color: var(--green); }

/* ---------- Drawer ---------- */
.drawer { position: fixed; inset: 0; z-index: 60; }
.drawer-scrim { position: absolute; inset: 0; background: rgba(8, 6, 5, .6); backdrop-filter: blur(2px); }
.drawer-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 94vw);
  background: var(--panel);
  border-left: 1px solid var(--line-strong);
  box-shadow: -30px 0 60px -30px #000;
  overflow: auto;
  animation: slideIn .22s ease;
}
@keyframes slideIn { from { transform: translateX(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-body { padding: 24px 22px 40px; }
.drawer-close { position: sticky; top: 10px; margin-left: auto; display: grid; z-index: 2; background: var(--panel-2); }

/* ---------- Modal ---------- */
.modal-root { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 18px; }
.modal-scrim { position: absolute; inset: 0; background: rgba(8, 6, 5, .68); backdrop-filter: blur(3px); }
.modal {
  position: relative; width: min(720px, 96vw); max-height: 90vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 16px;
  box-shadow: 0 40px 90px -30px #000;
  animation: pop .18s ease;
}
.modal.wide { width: min(980px, 96vw); }
@keyframes pop { from { transform: translateY(8px) scale(.99); opacity: .5; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 13px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.modal-head h2 { margin: 0; font: 600 19px/1.2 var(--serif); }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel); }
.modal-foot .spacer { flex: 1; }

.steps { display: flex; gap: 6px; margin: 0 0 16px; }
.step { flex: 1; padding-top: 7px; border-top: 2px solid var(--line); font-size: 11px; color: var(--dim); }
.step.on { border-top-color: var(--amber); color: var(--amber-soft); }
.step.done { border-top-color: rgba(224, 164, 95, .45); color: var(--muted); }

.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 7px; }
.pick {
  padding: 9px 10px; border-radius: 9px; text-align: left;
  background: rgba(255, 255, 255, .02); border: 1px solid var(--line);
}
.pick:hover { border-color: var(--line-strong); }
.pick.is-active { border-color: var(--amber); background: var(--amber-dim); }
.pick b { display: block; font-size: 12.5px; font-weight: 600; }
.pick span { display: block; font-size: 10.5px; color: var(--dim); margin-top: 2px; }

.attr-assign { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.attr-box { padding: 9px; border: 1px solid var(--line); border-radius: 9px; text-align: center; background: rgba(255, 255, 255, .02); }
.attr-box .k { font: 10px/1 var(--mono); letter-spacing: .1em; color: var(--dim); }
.attr-box select { margin-top: 6px; text-align: center; font-family: var(--mono); font-size: 15px; }

/* ---------- Palette ---------- */
.palette { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; }
.palette-scrim { position: absolute; inset: 0; background: rgba(8, 6, 5, .68); backdrop-filter: blur(4px); }
.palette-box { position: relative; width: min(680px, 96vw); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 40px 90px -30px #000; overflow: hidden; }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.palette-input .ico { color: var(--amber); }
.palette-input input { flex: 1; background: none; border: 0; min-height: 30px; font-size: 16px; padding: 0; }
.palette-input input:focus { outline: none; }
.palette-results { max-height: 54vh; overflow: auto; }
.p-result { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.p-result:hover, .p-result.is-active { background: var(--amber-dim); }
.p-result .nm { font-size: 13.5px; color: var(--ink-2); }
.p-result .nm mark { background: rgba(224, 164, 95, .28); color: var(--amber-soft); border-radius: 2px; padding: 0 1px; }
.p-result .sub { font-size: 10.5px; color: var(--dim); margin-top: 2px; }
.p-result .ty { margin-left: auto; font: 9.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.palette-foot { display: flex; gap: 14px; padding: 7px 14px; border-top: 1px solid var(--line); font: 10px/1.4 var(--mono); color: var(--dim); }
.palette-empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }

/* ---------- Menu ---------- */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 7px); width: 236px; z-index: 50;
  background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 11px;
  padding: 5px; box-shadow: 0 24px 50px -20px #000;
}
.menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 7px; background: none; font-size: 12.5px; color: var(--ink-2); }
.menu button:hover { background: rgba(255, 255, 255, .05); }
.menu button.danger { color: #efb0a9; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 3px; }
.menu-hint { margin: 6px 10px 5px; font-size: 10.5px; color: var(--dim); line-height: 1.4; }

/* ---------- Toasts ---------- */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
.toast {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px; border-radius: 10px;
  background: var(--panel-3); border: 1px solid var(--line-strong);
  box-shadow: 0 16px 36px -16px #000;
  font-size: 12.5px; color: var(--ink-2);
  animation: toastIn .2s ease;
}
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast .ico { color: var(--amber); margin-top: 1px; }
.toast b { color: var(--ink); }

/* ---------- Footer ---------- */
.footer { display: flex; gap: 14px; justify-content: space-between; flex-wrap: wrap; padding: 16px clamp(14px, 3vw, 34px) 22px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }


/* ---------- Print cards ---------- */
.print-sheet { max-width: 560px; margin: 0 auto; padding: 18px 20px 20px; background: #fff; color: #16130f; border: 1px solid #000; border-radius: 12px; font-family: var(--serif); }
.print-sheet .card-h { font-size: 26px; font-weight: 600; line-height: 1.1; margin: 0 0 4px; }
.print-sheet .card-sub { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #6b5d4d; border-bottom: 2px solid #16130f; padding-bottom: 8px; margin-bottom: 12px; }
.print-sheet .card-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 12px; }
.print-sheet .card-stats > div { border: 1px solid #a9957c; border-radius: 8px; padding: 6px 8px; }
.print-sheet .card-stats span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #6b5d4d; }
.print-sheet .card-stats b { font-size: 16px; font-family: var(--mono); }
.print-sheet .card-sec { margin-top: 10px; }
.print-sheet .card-sec h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6b5d4d; margin: 0 0 6px; }
.print-sheet .card-sec p, .print-sheet .card-sec li { margin: 0 0 6px; font-size: 13.5px; line-height: 1.5; color: #1c1a17; }
.print-sheet .card-sec b { font-weight: 700; }
@media print {
  .print-sheet { border:none; border-radius:0; max-width:none; padding:0; }
  .print-sheet .card-stats > div { break-inside: avoid; }
}

/* ---------- Utility ---------- */
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
.small { font-size: 11.5px; }
.right { text-align: right; }
.grow { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.mb-0 { margin-bottom: 0; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.subhead { display: flex; align-items: center; gap: 8px; margin: 0 0 9px; font: 600 12px/1.2 var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .col-3, .col-4, .col-5 { grid-column: span 6; }
  .col-7, .col-8 { grid-column: span 12; }
  .sheet-grid, .dice-layout, .rem-layout { grid-template-columns: 1fr; }
  .ref-layout { grid-template-columns: 290px 1fr; }
  .combat-setup { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .topbar { gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
  .brand-text em { display: none; }
  .search-trigger { order: 3; flex: 1 1 100%; max-width: none; }
  .search-trigger kbd { display: none; }
  .tabs { padding: 0 6px; }
  .tab { padding: 11px 9px; font-size: 12.5px; }
  .tab span:not(.tab-badge) { display: none; }
  .tab .ico { width: 18px; height: 18px; }
  .tab.is-active span:not(.tab-badge) { display: inline; }
  .col-3, .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
  .ref-layout { grid-template-columns: 1fr; }
  .ref-list { max-height: 320px; }
  .notes-layout { grid-template-columns: 1fr; }
  .notes-side { max-height: 260px; }
  .quick-rolls { grid-template-columns: repeat(4, 1fr); }
  .dice-tray { grid-template-columns: repeat(5, 1fr); }
  .page-head { gap: 10px; }
  .head-actions { margin-left: 0; width: 100%; }
  .combatant { grid-template-columns: 38px 1fr; }
  .cside { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .combatant .cbar { max-width: none; }
  .footer { font-size: 10px; }
}
@media (max-width: 520px) {
  .brand-text strong { font-size: 15px; }
  .btn-lg { width: 100%; }
  .head-actions .btn { flex: 1; }
  .stat-grid { grid-template-columns: repeat(4, 1fr); }
  .stat .v { font-size: 18px; }
  .modal-root { padding: 8px; }
  .attr-assign { grid-template-columns: repeat(2, 1fr); }
  .dice-row .field { flex: 1 1 40%; }
}

@media print {
  body { background: #fff; color: #111 !important; }
  body::before, .topbar, .tabs, .footer, .head-actions, .toasts { display: none !important; }
  .view, .drawer, .palette { display: none !important; }
  .card { border-color: #bbb; box-shadow: none; break-inside: avoid; background: #fff; }
  .page-title, .card-head h2, .entry h2 { color: #111; }
  .modal-root { position: static; display: block !important; padding: 0; overflow: visible; }
  .modal-scrim { display: none !important; }
  .modal { position: static; width: 100%; max-width: none; max-height: none; overflow: visible; border: none; box-shadow: none; background: #fff; color: #111; }
  .modal-head, .modal-foot, .print-actions, .drawer-close { display: none !important; }
  .modal-body { padding: 18pt 18pt 24pt; color: #111; }
  #cardPrint .kv { color: #111; }
  #cardPrint h2, #cardPrint h3 { color: #111; }
  #cardPrint .entry p, #cardPrint .entry .action, #cardPrint .entry a { color: #111; }
  #cardPrint .muted, #cardPrint .dim, #cardPrint .hint { color:#333; }

   "name": "Богатство",
   "cat": "Снаряжение",
   "text": "Золото и валюта\nЗолото — универсальная награда, которая даёт героям свободу выбирать собственные поощрения. Часть золота уйдёт на необходимое — например, на ночлег, — но главная его ценность в том, что на него можно приобрести впечатляющие улучшения: оружие, доспехи, зелья, волшебные палочки или магические предметы.\n\nВалюта состоит из серебряных (см) и золотых монет (зм). 10 см = 1 зм. 1 см — это примерно стоимость скромной трапезы; 1 зм — роскошного пира. В большинстве маленьких городков можно найти снаряжение и предметы стоимостью до 50 зм. Для более ценных покупок придётся отправиться в крупный город или найти странствующего торговца.\n\nСколько золота?\nТаблица ниже показывает среднее количество золота, которое каждый герой обычно получает за уровень. Задание ради благородного дела или от бедного селянина может оплачиваться скромно (на один-два уровня ниже среднего), а задание от богатого аристократа с сомнительными мотивами — щедро (на один-два уровня выше среднего).\n\nЗолото за уровень\n| УРОВЕНЬ | ЗОЛОТО  |\n| ------- | ------- |\n| 1       | 25      |\n| 2       | 40      |\n| 3       | 80      |\n| 4       | 150     |\n| 5       | 280     |\n| 6       | 450     |\n| 7       | 750     |\n| 8       | 1 200   |\n| 9       | 2 000   |\n| 10      | 3 000   |\n| 11      | 5 000   |\n| 12      | 7 000   |\n| 13      | 10 000  |\n| 14      | 17 000  |\n| 15      | 25 000  |\n| 16      | 40 000  |\n| 17      | 60 000  |\n| 18      | 90 000  |\n| 19      | 130 000 |\n| 20      | 200 000 |\n\nПокупка магических предметов\nБольшинство искателей приключений могут накопить на необычные или редкие магические предметы, которые порой продаются в специализированных лавках крупных городов. Однако очень редкие или легендарные предметы, как правило, слишком дороги для покупки — их нужно добыть в приключениях.\n\nСлишком много золота?\nИзбыток золота несёт свои трудности и может привлечь нежелательное внимание:\n\n Громоздко. Много золота с собой не унесёшь — рано или поздно карманы и сумки переполнятся. Крупные суммы придётся везти караваном или кораблём и хранить в надёжном месте, пока ты в приключениях.\n Бандиты и воры. Карманники, разбойники и даже организованная преступность могут захотеть свою долю.\n Зависть. Конкуренты-авантюристы, «старые деньги» знати, обиженные бедняки, сборщики долгов и т.д.\n Коррупция. Чиновники, ищущие взятки, поддельные «возможности», подозрительные власти.\n Проклятия. Тайник с золотом или драгоценностями, проклятый тёмной магией, жадными духами или стражами сокровищ.\n Слава. Любители наживы, подхалимы, охотники за головами или военачальники — все захотят свою долю.\n Нуждающиеся. Обнищавшая деревня, общественные проекты, нищие, союзники в беде.\n Алчные монстры. Драконов и других могущественных существ привлекают золотые богатства."

  {
   "name": "Действия героев",
   "cat": "Бой",
   "text": "В свой ход герои получают 3 действия, чтобы Атаковать, Перемещаться по полю боя, Колдовать и т.д. Как правило, любое одиночное действие в бою стоит 1 действие. Некоторые мощные заклинания или особые способности требуют больше времени и стоят больше действий.\n\nВсе 3 действия восстанавливаются в конце твоего хода, так что копить их незачем. Трать все в свой ход — в конце хода получишь их обратно!\n\nБесплатные действия.\nОни не стоят действий и не требуют ресурсов (например, маны), если не сказано иное. Герои могут выполнять простые задачи (открыть незапертую дверь, выкрикнуть короткую фразу, бросить предмет, прервать концентрацию и т.д.) бесплатно 1/ход.\n\n---\n\nАтака\nЗаклинание или способность, способные навредить врагу, считаются атакой. Брось кости, указанные в описании заклинания, оружия или способности, и нанеси столько урона, сколько выпало на костях. Однако если выпадет 1 — будет промах, и атака не окажет никакого эффекта. При атаках с несколькими костями кость слева называется Главной. Она определяет, попала атака или нет.\n\nВзрывные криты. Максимум на Главной кости — критическое попадание (крит). При крите брось Главную кость ещё раз и прибавь результат к итогу. Повторяй каждый раз, когда выпадает максимум — предела нет, кроме твоей удачи! Криты также игнорируют броню монстра (см. стр. 14).\n\nПоспешные атаки. Герой может атаковать больше одного раза за ход, но каждая дополнительная атака после первой — поспешная: за каждую такую атаку добавляется нарастающая помеха, что повышает шанс промаха и снижает средний урон последующих атак. Для способностей, требующих спасбросок (например, Захват), враги бросают с нарастающим преимуществом.\n\n---\n\nЗаклинание\nЧтобы произнести заклинание, у героя должна быть свободна 1 рука (или удерживаемая в руках магическая фокусировка), возможность говорить, а также может потребоваться мана. Стоимость заклинания в мане равна его кругу; заговоры не стоят маны (подробнее в «Заклинания» на стр. 44).\n\nУсиление заклинаний. Некоторые заклинания дают усиленный эффект за каждую дополнительную единицу маны. Герой может усилить заклинание только до того круга, который он открыл.\n\nДвижение\nПерсонаж может переместиться на расстояние до своей скорости (6 клеток, если не указано иное). Движение можно разбивать другими действиями, а герой может тратить несколько действий на Движение за один ход. На Труднопроходимой местности скорость уменьшается вдвое. Передвижение по поверхности, пригодной для лазания (деревья, скалы, некоторые здания и т.д.), считается Труднопроходимой местностью.\n\n---\n\nОценка\nОтличный способ проявить креативность и отыгрыш в бою. Выбери один из вариантов и сделай проверку навыка Сл 12, чтобы:\n Задать вопрос. О слабостях, способностях или ближайших планах врагов, об окружении, сюжете и т.д. Мастер должен ответить честно.\n Найти уязвимость. Увеличить следующий бросок Главной кости против цели на 1 в этом раунде.\n• Предвидеть опасность. Уменьшить все Главные кости, брошенные против тебя, на 1 в этом раунде.\n\nЗаметки об Оценке\nКакой навык использовать? Выбранный навык должен иметь смысл в данных обстоятельствах. Например, если ты рядом с врагом, можно использовать Мощь, чтобы найти уязвимость, но против далёкого врага это может не сработать. Или если хочешь узнать слабости элементаля, скорее всего подойдёт Магия.\nМонстры не дураки! Нельзя использовать Оценку с одним и тем же навыком больше одного раза за столкновение — враги адаптируются к твоей тактике. Придётся проявить изобретательность!"

  {
   "name": "Дистанция и досягаемость",
   "cat": "Бой",
   "text": "Некоторые умения, оружие и заклинания имеют указанную Дистанцию или Досягаемость — она определяет, как далеко может находиться цель. Если ничего не указано, по умолчанию Досягаемость 1.\n\n Ближний бой. Если рядом с тобой есть враг, твои атаки Дальнего боя совершаются с помехой (атаки с Досягаемостью не затрагиваются).\n Дальняя дистанция. Ты можешь получить помеху 1, чтобы увеличить Дистанцию любой атаки Дальнего боя на +2 (максимум +6).\n\nАбстрактные расстояния\nПри желании можно использовать упрощённую систему расстояний. Используй Близко, Средне и Далеко. За одно перемещение со Средней дистанции можно переместиться на Близко или Далеко. По существам на расстоянии Близко можно бить с Досягаемостью/Дистанцией до 4; на Средней дистанции — до 6; дальше — Далеко. Как всегда, Мастер разрешает неоднозначные ситуации и определяет, какие существа попадают под действие умений с областью действия."

  {
   "name": "Дополнительные правила",
   "cat": "Правила",
   "text": "Если твоя группа любит дополнительные тактические фишки, Мастер может разрешить попробовать некоторые из этих вариантов, чтобы добавить остроты в игру. Всегда можно опробовать правило одну сессию и решить, нравится ли оно, прежде чем принимать окончательно.\n\n---\n\nМультиклассирование\n Если Мастер хочет дать опытным игрокам больше свободы (и потенциально сломанные комбо!), при повышении уровня герой может выбрать любой класс. Например, Берсерк 4-го уровня при повышении может выбрать Командира и взять умения Командира 1-го уровня вместо умений Берсерка 5-го уровня. У него будет 4 Кости Хитов d12 и одна d10. Герой получает владение снаряжением всех своих классов, но использует спасброски с преимуществом/помехой того класса, который имеет наибольший уровень.\n\n«Сломанное» может быть веселым!\nПланирование, создание, оптимизация и «поломанные» билды класса — это и ЕСТЬ веселье для многих. Мастеру, возможно, придётся значительно усложнить игру, если мультиклассирование разрешено. Мастер также может наложить вето на особо мощные, неинтересные или неправдоподобные комбо ради сюжета и общего удовольствия за столом. Если это произошло — молодец! Твой герой оказался слишком могущественным для реальности.\n\n---\n\nМаленькие группы\nМастер и один герой могут играть с помощью напарника. Напарники — это Персонажи Мастера, которыми управляет игрок в бою и Мастер вне боя. У напарников 2 действия, и они всегда на 1 уровень ниже героя. Если главный герой погибает, напарника можно повысить на 1 уровень, и он наймёт собственного напарника, чтобы продолжить приключение! Мастер может разрешить одного-двух напарников и для группы из 2–3 героев.\n\n---\n\nБольшие группы\nСторонние приключения обычно сбалансированы для групп из 3–5 игроков. Играть очень большими группами (6–10+ героев) можно гораздо проще, ограничив действия каждого героя до 2 вместо 3. Никакой другой перебалансировки не требуется.\n\n---\n\nБыстрый отдых\nДля более героического и динамичного сюжета Безопасный Отдых может исцелять все Ранения.\n\n---\n\nКритическое лечение\nЛечение работает как бросок атаки. Максимум на кости — крит (бросок повторяется, как при критической атаке), 1 — провал лечения (примечание: этот вариант будет ВЕСЁЛЫМ для той группы, которой нравятся большие, драматичные и непредсказуемые моменты). При использовании этого варианта подумай об увеличении размера кости на один шаг (d4 » d6 » d8 » d10 » d12).\n\n---\n\nЯ был на высоте\nПолучение крита существом, забравшимся на высоту, может привести к падению. Мастер может потребовать разумный спасбросок СИЛ, а слабый персонаж (например, кобольд) может просто упасть автоматически.\n\n---\n\nМетание зелий\nЗелья работают как Дальнобойная атака (Дистанция 8). Зелье промахивается при 1; в остальных случаях лечит вполовину меньше — часть разбрызгивается и пропадает.\n\n---\n\nУдар лежачему\nПерсонаж, встающий из состояния Сбит с ног, позволяет соседним врагам совершить Атаку по возможности (как героям, так и монстрам).\n\n---\n\nПритворись мёртвым\nКогда Хиты героя падают до 0, он может попытаться притвориться мёртвым — упасть и сделать проверку Влияния (или другого навыка по ситуации).\n\n---\n\nВдохновение\nКогда герой делает что-то запоминающееся (отыгрывает яркий момент, смешит всех, промахивается несколько раз подряд или иным образом проявляет себя), Мастер может дать Вдохновение: возможность перебросить любую одну кость. Вдохновение пропадает после Безопасного Отдыха.\n\n---\n\nОтступление\nМир опасен, и некоторые бои невозможно выиграть. Любой герой может объявить отступление в свой ход. Если группа согласна — и нет сюжетной причины, мешающей побегу (например, герои пойманы в сети и окружены стаей гадких кобольдов) — Мастер позволяет им бежать.\n\nКаждый герой описывает свой побег (заклинание, использует снаряжение или проверку навыка). Возможны последствия: получение урона, Ранение или провал задания. Если побег особенно изобретателен, Мастер может позволить группе уйти без последствий. В конце концов, позор отступления — уже достаточное наказание!\n\n---\n\nДругие ключевые характеристики\nИгроки могут поменять Ключевую или Второстепенную характеристику класса, если это имеет смысл (например, ЛВК и ВОЛ для Мошенника).\n\n---\n\nСложные персонажи\nМастер может разрешить героям выбрать 2 предыстории и/или бонуса происхождения.\n\n---\n\nНестандартные кости оружия\nДля больших костей урона оружия можно использовать кости другого размера, если их сумма равна исходной. Например: глефа с 1d10 может стать 1d4+1d6 или 1d6+1d4 (первая кость считается Главной)."

   "text": "Затишье\n\nВремя, когда герои не заняты приключениями, называется Затишьем. Ты можешь использовать это время, чтобы восстановиться после приключений и заняться другими делами. Не каждый момент Затишья обязательно описывать или отыгрывать. При желании большую часть такого времени можно пропустить, чтобы вернуться к приключениям. Примеры занятий:\n• Переобучение. Потрать время, чтобы изменить выбранные способности, особенности — или, если это уместно по сюжету, даже подкласс.\n• Сбор сведений. Встречайся с Персонажами Мастера, узнавай новости, собирай слухи и подсказки о заданиях.\n• Личные цели. Добивайся целей из своей предыстории или выполняй другие, более мелкие задания, которые ты выбрал.\n• Покупай и продавай. Приобретай новое снаряжение и продавай сокровища, собранные в приключениях.\n• Выступай. Играй музыку, рассказывай истории, участвуй в соревнованиях или выступай на публике, чтобы заработать золото или славу.\n• Создавай предметы. Изготавливай оружие, доспехи или простые вещи из имеющихся материалов.\n• Общайся. Создавай союзы, заводи новых друзей или новых врагов.\n• Инвестируй. Вкладывай золото в бизнес или торговлю ради прибыли.\n• Наставляй. Научи другого героя или Персонажа Мастера какому-нибудь навыку или умению.\n• Исследуй. Расследуй тайны, изучай древние тексты или раскрывай скрытые знания.\n• Служи. Оказывай помощь покровителю или божеству в обмен на услугу, или займись благотворительностью.\n• Строй. Создай базу, открой бизнес, изготовь осадное оружие или построй всё, что только сможешь представить (разумеется, с учётом возможностей Мастера и сеттинга)."

   "text": "Ты можешь попытаться схватить другое существо, если находишься в пределах Досягаемости и у тебя свободна хотя бы 1 рука (или есть другой способ схватить). Если цель проваливает спасбросок СИЛ или ЛВК (Сл 10 + твой модификатор СИЛ или ЛВК):\n\n\tтвоего размера или меньше — Схвачена.\n\tкрупнее тебя — ты получаешь состояние Верхом.\n\nПринудительное перемещение (оттолкнуть схватившего), недееспособность или трата действия на успешный спасбросок СИЛ или ЛВК прекращают захват.\n\nОбездвижен\nРаботает как Схвачен, но накладывается предметами (например, цепями, верёвкой, корнями) и игнорирует ограничения по размеру. Также прекращается любым логичным способом — например, взломом замка или перерезанием/сжиганием верёвки."

   "name": "Колдовство",
   "cat": "Магия",
   "text": "Мана\nМогущественные заклинания определённого круга требуют маны — частицы жизненной силы заклинателя — для подпитки. Стоимость маны заклинания равна его кругу. Подробнее о получении маны разными классами — в книге Героев. Заговоры не требуют маны.\n\nУсиление\nТы можешь потратить дополнительную ману на заклинания (до уровня круга, который тебе доступен), чтобы усилить их за каждую потраченную единицу маны.\n\nНесколько целей / Область действия\nАтаки по нескольким целям или по области действия следуют особым правилам для ускорения игры: они не промахиваются и не считаются критическими, а один бросок применяется ко всем целям. (Игнорируй преимущество/помеху от состояний отдельных целей — например, Ослеплен или Схвачен — но все, что даёт тебе преимущество/помеху, применяется к твоему броску как обычно.)\n\nЗаклинания со спасброском\nСложность спасброска героя обычно равна 10+КЛЮЧ.\n\nДистанция и Досягаемость\nКак и оружие, заклинания с Дистанцией могут поразить существ на расстоянии, но применяются с помехой, если в соседней клетке есть враг. Добавь 1 кость помехи, чтобы получить +2 к Дистанции (макс. +6). Заклинания с Досягаемостью так не работают и применяются как обычно, даже в ближнем бою.\n\nШколы магии\nСуществует 6 основных школ магии. У каждой школы есть базовые заклинания — заговоры — и 9 кругов всё более мощных заклинаний, которые открываются по мере роста уровня героев. Герои могут использовать любое заклинание из известных школ в пределах открытых кругов.\n\n Заклинания огня. Наносят высокий стабильный урон на средней дистанции. Некоторые заклинания Огня накладывают состояние Тлеющий и получают дополнительные разрушительные эффекты против Тлеющих врагов.\n Заклинания льда. Наносят средний урон на дальней дистанции с упором на контроль поля боя и защиту заклинателя. Некоторые заклинания Льда имеют дополнительные эффекты против Скованных целей.\n Заклинания молнии. Наносят высокий урон на дальней дистанции с упором на телепортацию по полю боя и использование металлического снаряжения существ. Однако некоторые заклинания Молнии могут не найти заземления и ударить самого заклинателя.\n Некротические заклинания. Призывают жутких приспешников, манипулируют целями и ловят их в ловушки. Некоторые рискованные некротические заклинания охотятся на раненых существ, высасывая их жизненную силу, — но часто не отличают друга от врага.\n Заклинания сияния. Уничтожают нечестивых, трусливых и тех, кто осмелился навредить тебе или союзникам. Одинаково эффективны на расстоянии и в ближнем бою. В том числе заклинания защищают, залечивают раны и даже воскрешают существ!\n Заклинания ветра. Помогают перемещать союзников и врагов по полю боя. Рассекают и режут целые группы врагов и наносят жестокий дополнительный урон при критическом попадании.\n\nТайные заклинания\nНекоторые заклинания были сокрыты или утеряны на протяжении веков. Слишком опасные для широкого круга или по иным причинам, они иногда попадаются искателям приключений (или вырываются из мёртвых рук побеждённого Лича)."

   "name": "Конвертация из 5e",
   "cat": "Правила",
   "text": "Приключения\nЛюбое приключение, совместимое с 5e, можно проводить прямо из книги без дополнительной подготовки и с минимальными изменениями. Для навыков, спасбросков и состояний, которые были объединены или изменены, просто используй обновлённое название.\n\nСпасброски\nСпасбросок ТЕЛ → Спасбросок СИЛ\nСпасбросок МДР/ХАР → Спасбросок ВОЛ\n\nПроверки навыков\nУход за животными/Природа/Выживание → Природа\nАтлетика → Мощь\nОбман/Убеждение/Выступление → Влияние\nИстория/Религия → Знания\nРасследование/Медицина → Анализ\nЛовкость рук/Акробатика → Сноровка\n\nСостояния\nПарализован, Оглушен, Без сознания → Недееспособен\n\nМонстры\nЛюбой статблок монстра из 5e можно использовать в Nimble с минимальными правками на ходу. Проводи их как написано: движение, действие, бонусное действие и т.д.; просто замени КД на броню и бросай их кости урона для атак.\n\n Атаки монстров. Промахиваются, попадают и критуют так же, как герои.\n Броня монстров. Монстры из 5e с КД 14–17 имеют Среднюю броню, меньше — без брони, больше — Тяжёлая.\n\nО броне\nБаланс столкновений в Nimble гораздо более гибкий, чем в других играх. Мастер может свободно повышать или понижать броню, не ломая баланс. Если у слишком многих монстров одинаковый КД, Мастер может повысить/понизить их броню для разнообразия. Без брони — основная масса монстров (~60%), Средняя — нечасто (~30% за сессию), Тяжёлая — редкость (~10%).\n\nЛегендарные монстры 5e\nЛегендарные монстры Nimble проще в управлении и дают более динамичный опыт, но монстрами из 5e тоже можно управлять! Замени КД на броню и бросай кости урона для атак. Они действуют 1 раз/раунд (используя для этого Действия Логова/Легендарные действия так, как это принято в 5e).\n\nОпциональные правки\n Спасброски монстров. Для упрощения бросай d20 без бонусов. Если монстр заметно Сильный/Хилый, Быстрый/Медлительный или Умный/Глупый — дай ему преимущество или помеху на спасброски СИЛ, ЛВК, ВОЛ или ИНТ. Легендарные монстры могут иметь преимущество на несколько или на все спасброски.\n Свобода действий. Когда монстр лишает героя свободы действий (Недееспособен, парализован, окаменел или оглушен), подумай о состоянии Ошеломлен (−1 действие на 1 раунд).\n\nЗаклинания 5e\nБольшинство заклинаний 5e легко использовать в Nimble без изменений. Хотя боевые заклинания 5e не рекомендуются, уникальные прикладные заклинания могут разнообразить игру. Руководствуйся здравым смыслом, но вот основные правила:\n\n Уровень заклинания = стоимость в мане. Дистанция в Nimble короче (обычно максимум 16 клеток / 80 футов (24 м)).\n Заговоры, бонусные действия, реакции или другие простые заклинания без урона стоят 1 Действие; прочие заклинания с уровнем стоят 2 Действия, крупные заклинания области, которые можно применять на расстоянии, стоят 3 Действия.\n\nМагические предметы 5e\nДля предметов, меняющих характеристики, просто используй модификатор характеристики.\n\nПояс силы великана\nПока вы носите этот пояс, ваше значение Силы становится 21. -> Пока вы носите этот пояс, ваша Сила равна 5.\n\nРасы и классы 5e\n Раса и предыстория: Выбери происхождение и предысторию Nimble и обыграй их как угодно.\n Классы: Для лучшего опыта рекомендуется использовать класс Nimble; однако можно использовать любой класс из 5e. Просто подставь правила атак и брони Nimble. Не пытайся смешивать заклинания, черты или другие опции из 5e и Nimble — придерживайся одной системы. Подробнее — в буклете Nimble 5e.\n\nПроверки навыков монстров\nЕсли когда-нибудь нужна встречная проверка навыка, а у монстров Nimble нет навыков или характеристик, можно бросить дополнительную кость в зависимости от способностей существа и добавить её к проверке:\n\n Без бонуса или +1d4. Монстр не обучен или средне владеет навыком.\n +1d6–1d10. Монстр обучен или очень хорош в навыке.\n• +1d12–1d20. Монстр мирового класса или обладает легендарными способностями в навыке."

я, прыжков и других силовых подвигов.\n\nПрирода (ВОЛ)\nМастерство выживания в дикой местности, навигации, выслеживания и обращения с животными. Используй Природу, чтобы выживать в глуши, определять растения и животных, точно выслеживать существ. Охватывает знания о Зверях, Чудовищах и Растениях — их поведении, местах обитания и особенностях.\n\nВосприятие (ВОЛ)\nОбщая способность замечать тонкие детали в окружении. Используй Восприятие, чтобы находить скрытые предметы, обнаруживать тайные проходы, чувствовать едва заметные изменения обстановки и понимать, когда за тобой следят или наблюдают. Охватывает умение улавливать неочевидные сигналы и скрытые угрозы.\n\nСкрытность (ЛВК)\nУмение оставаться незамеченным и двигаться бесшумно. Используй Скрытность, чтобы прятаться, проскальзывать мимо стражников, избегать обнаружения и перемещаться, не привлекая внимания.\n\n---\n\nПример Интуиции\nИгрок: «О нет! Я забыл купить верёвку в городе!»\nМастер: «Сделай проверку Интуиции — возможно, твой герой об этом подумал.»"

анное оружие (стул, сковорода, большой камень) обычно наносит 1d4+СИЛ или 1d6+СИЛ урона. Мастер может разрешить использовать кости побольше или другие свойства, если это имеет смысл. Импровизированное оружие скорее всего сломается при критическом попадании!\n\nМодификация оружия\nМожно ли заменить посох дубиной? Конечно! Сай вместо кинжала? Разумеется! Можно ли заплатить кузнецу, чтобы он сделал твой Большой молот с уроном 1d12 наносящим 2d6 или 3d4? Сумма костей одинакова — баланс не нарушается; спроси Мастера! А чтобы кузнец сделал Кинжал с таким уроном? Нет, извини!"

   "name": "Реакции героев",

   "text": "Реакции стоят 1 действие и совершаются не в свой ход. Герой может использовать каждую реакцию не чаще 1/раунд — и начнёт свой ход с меньшим количеством действий. Реакции:\n\n---\n\nЗащита\nУменьши урон от любой одиночной атаки на величину своей Брони при использовании этой реакции. На усмотрение Мастера от некоторого урона Защититься нельзя (например, психический урон или некоторые области действия).\n\n---\n\nВмешательство\nЕсли существо в пределах 2 клеток вот-вот получит удар, ты можешь оттолкнуть его и стать новой целью атаки. Ты занимаешь его клетку и перемещаешь его в соседнюю клетку по своему выбору.\n\nВмешательство И Защита?\nДа! Если у тебя достаточно действий, можно использовать Вмешательство и Защиту одновременно. Однако ни одну из этих реакций нельзя использовать повторно, пока не закончится твой следующий ход — каждая ограничена до 1/раунд.\n\n---\n\nАтака по возможности\nАтака ближнего боя с помехой против врага по соседству, который добровольно отступает. Монстры не совершают атак по возможности — это могут делать только герои.\n\n---\n\nПомощь\nДай союзнику преимущество на бросок, если можешь обоснованно объяснить Мастеру, как ты помогаешь в данной ситуации (ограничение: одна реакция Помощи на каждый бросок). Мастер может запросить проверку навыка или дать преимущество автоматически — зависит от того, насколько хороша идея.\n\nКомандная работа!\nПомощь как Реакция героя — отличный способ привнести в бой командную работу, отыгрыш и креативность. Твой товарищ провалил бросок? Может, ещё не всё потеряно! Думай быстро — возможно, ты поможешь ему преуспеть."

   "name": "Руководство по столкновениям",
   "cat": "Бой",
   "text": "Уровни монстров\nСоздавать столкновения в Nimble просто! Сложи уровни всех героев (например, 3 героя 2-го уровня = суммарный уровень 6). Монстры с такой же суммой уровней — это сложный, но честный бой. Меньше — средний или лёгкий. Больше — смертельный или очень смертельный.\n\nПример\nГрифон — монстр 4-го уровня. Стая из 6 грифонов (суммарно 24 уровня монстров) станет сложным столкновением для: 6 героев 4-го уровня, 4 героев 6-го уровня или 3 героев 8-го уровня.\n\nТипичное столкновение включает 1–4 монстра на героя (не считая миньонов). Для эпичной схватки с одним злодеем используй легендарного монстра, а для орд — миньонов.\n\nВажное замечание!\nЕсли герои или монстры значительно превосходят друг друга числом, столкновение может оказаться легче или сложнее ожидаемого. 1–4 монстра на героя — оптимальное соотношение для большинства столкновений.\n\nСтолкновения за одну сессию\nОбычно за сессию происходит 2–5 боевых столкновений, но это можно регулировать. Если игрокам весело без боя — не навязывай его, особенно если они ловко избежали схватки или она не вписывается в сюжет. Если история требует больше пяти столкновений — вперёд! Главное — игра должна оставаться увлекательной: избегай тривиальных, мучительно сложных или однообразных боёв.\n\nСложность столкновений\nЛёгкая\nЕсли суммарный уровень монстров меньше половины суммарного уровня героев — это лёгкое столкновение. Герои потеряют минимум хитов и ресурсов. Такие бои подходят для проверки новых способностей или оценки прогресса — или для истощения ресурсов. Они дают игрокам почувствовать силу, особенно после повышения уровня. Используй 1–2 лёгких столкновения за типичную сессию.\n\nСредняя\nКогда суммарный уровень монстров около 75% от уровня героев, жди умеренной потери хитов и ресурсов. Герои получат урон, но никто не должен упасть до 0 хитов. Используй 1–2 средних столкновения за типичную сессию.\n\nСложная\nКогда уровни монстров равны уровням героев — столкновение будет сложным, но честным. Героям придётся потратить значительные ресурсы. Кто-то может упасть до 0 хитов, но никто не должен погибнуть, если только не из-за плохой тактики или невезения. Используй 1 сложное столкновение за типичную сессию.\n\nСмертельная\nКогда уровни монстров составляют 100–125% от уровней героев — столкновение требует стратегического мышления и командной работы. Подходит для жёстких боёв, хорошо экипированных отрядов или боссов кампании. Используй с осторожностью!\n\nОчень смертельная\nПри 150% и более уровней монстров относительно героев, столкновение крайне опасно. Если герои не оптимизированы до предела (или используют мультикласс) и не играют безупречно, им почти наверняка придётся отступить — или погибнуть. Используй только в случаях, когда герои допустили грубую ошибку: ты предупредил их об опасности, а они проигнорировали.\n\nОтдых и восстановление\nГерои часто возвращаются на базу или в город для отдыха после каждой сессии, но это не строгое правило. Будь гибким. Если у игроков накопилось слишком много Ранений, предоставь им возможность для безопасного отдыха: дружелюбный жрец, скрытый оазис. Если безопасный отдых невозможен — снизь сложность столкновений, чтобы приключение продолжалось. Иначе героям придётся прервать путешествие ради восстановления.\n\nРазнообразие брони\nХотя соотношение может варьироваться, слишком много бронированных врагов затягивает бой. Используй броню, чтобы добавить красок, но не допускай отчаяния. Для сбалансированной сессии ориентируйся примерно на:\n• 60% без брони.\n• 30% средняя броня.\n• 10% тяжёлая броня."

   "text": "Твой герой — твой след в мире игры. Вот как создать своего героя:\n\n---\n\nШаг 1: Выбери класс\nКласс определяет стиль игры и влияет на то, как ты взаимодействуешь с миром:\n\n БЕРСЕРК. Неудержимая сила ярости и разрушения.\n МОШЕННИК. Хитрый, коварный плут, дерущийся без правил.\n КОМАНДИР. Тактик на поле боя, лидер и мастер оружия.\n ОХОТНИК. Находчивый выживальщик, мастер лука и опытный следопыт.\n МАГ. Управляй стихиями Огня, Льда и Молнии.\n СТРАЖ КЛЯТВЫ. Верный страж, защитник и мститель за слабых.\n ТЕНЕМАНТ. Призывай орды одноразовых приспешников.\n ПАСТЫРЬ. Повелевай жизнью и смертью. Веди верного спутника.\n МЕНЕСТРЕЛЬ. Вдохновляющая атмосфера, острый ум, ещё более острый язык.\n БУРЕВЕСТНИК. Повелитель погоды, зверей и природы.\n ВИХРЬ. Дисциплинированный боец с молниеносными ударами.\n\n---\n\nШаг 2: Выбери происхождение и предысторию\n(и, при желании, мотивацию для приключений). Что заставило твоего героя отправиться в путь? Откуда ты знаешь других героев?\n\n---\n\nШаг 3: Заполни лист персонажа\nЭтот удобный листок помогает отслеживать характеристики, умения, снаряжение и другую важную информацию.\n\nЛист персонажа\n1. Основные данные и характеристики\nЗаполни данные персонажа: Имя, Происхождение, Класс, Уровень, Рост и Вес. Отметь стрелкой усиленный (+) и ослабленный (–) спасброски, и выбери набор характеристик (рекомендуется: ставь наибольшие числа в КЛЮЧЕВЫЕ характеристики своего класса).\n Стандартный: +2, +2, +0, –1\n Сбалансированный: +2, +1, +1, +0\n Мин–Макс: +3, +1, –1, –1\n\nПример\nУ Мошенника ключевые характеристики — ЛВК и ИНТ. С набором Мин-Макс можно поставить +3 в ЛВК, +1 в ИНТ, а –1 в ВОЛ и СИЛ. Также отметь ▲ для спасбросков ЛВК и ▼ для спасбросков ВОЛ.\n\n---\n\n2. Очки навыков\nНа 1-м уровне впиши бонусы характеристик в соответствующих навыках (например, герой с +2 ЛВК ставит +2 в Сноровку и Скрытность), а затем распредели ещё 4 дополнительных очка навыков куда захочешь.\n\nПример\nЕсли у тебя –1 ИНТ — отметь –1 в Магии, Анализе и Знаниях. Повтори для остальных характеристик. Затем 4 дополнительных очка можно потратить так: +2 в Скрытность и +2 в Сноровку; по +1 в четыре любых навыка; или все 4 очка в один любимый навык. Решать тебе!\n\n---\n\n3. Второстепенные характеристики\nОтметь максимум хитов и размер Костей Хитов (смотри свой класс), количество Костей Хитов (по умолчанию: равно уровню), Инициативу (по умолчанию: ЛВК), Размер, Скорость (по умолчанию: 6), максимум ранений (по умолчанию: 6) и ячейки инвентаря (10+СИЛ).\n\n---\n\n4. Снаряжение и деньги\nГерои начинают на 1-м уровне со снаряжением, указанным для их класса и предыстории, ИЛИ с 50 зм на покупку стартового снаряжения. Если начинаешь на более высоком уровне, умножь эту сумму на свой стартовый уровень.\n\nНо мой персонаж — богатый дворянин!\nНичего страшного, но пока твоему персонажу доступна только эта сумма золота. Почему остальное богатство сейчас недоступно — решать тебе и твоему Мастеру; добраться до полного состояния может стать отличным заданием!\n\n---\n\n5. Языки\nВсе герои по умолчанию говорят на Общем. Каждое очко ИНТ даёт один дополнительный известный язык. На этих языках обычно говорят:\n\n Общий. Большинство разумных существ.\n Дварфийский. Дварфы, гномы и великаны.\n Эльфийский. Эльфы, феи и сильваны.\n Гоблинский. Гоблины и орки.\n Инфернальный. Различные исчадия и культисты.\n Воровской жаргон. Проходимцы и мошенники.\n Небесный. Небожители и жрецы.\n Драконий. Драконы, драконорождённые и кобольды.\n Первородный. Элементали и древние существа.\n Глубинная речь. Обитатели подземного мира.\n\nГРОФВИНТ ДРАЗЛОН!\nЗнание чужого языка открывает двери, которые не откроет одно лишь оружие. Быть вооружённым до зубов, но не уметь общаться — верный путь нажить врагов.\n\n---\n\n6. Прочие умения\nОтметь все особые умения, полученные от класса, происхождения, предыстории и т.д.\n\n---\n\n7. Ячейки инвентаря\nУ каждого героя 10+СИЛ ячеек инвентаря для снаряжения и добычи (в руках, на себе или в рюкзаке).\n 1 ячейка вмещает одноручное оружие, щит, надетую броню, связку дротиков, 500 зм или 2 зелья.\n 2 ячейки вмещают двуручное оружие, снятую броню или аналогичные громоздкие предметы.\n• Мелкие связанные предметы можно объединить в одну ячейку для простоты (например, Походные принадлежности: мыло, одеяло, щётка, провизия).\n\nО боеприпасах.\nВ большинстве игр нет нужды считать боеприпасы. Если у тебя есть колчан — стрел достаточно. Считай, что герой собирает выпущенные стрелы, мастерит новые или покупает их в городе.\n\nКак вариант, твой Мастер может разрешить носить что угодно без лишнего учёта, пока ты не перегибаешь палку!"

   "text": "Если ты креативный Мастер или у тебя творческие герои — попробуй это опциональное правило!\n\n---\n\nКогда ты назначаешь особенно важную или интересную проверку навыка или спасбросок, вместо бинарного «прошёл» или «провалил» считай результат в пределах 3 от Сложности частичным успехом (Примечание: если используешь это правило, подумай о повышении Сл на 1–2 для компенсации). Например, при Сл 13 результат 13+ — полный успех, а 10–12 — частичный успех:\n• Переговоры. Торговец не может помочь, но знает кого-то, кто может…\n• Прыжок. Ты не допрыгнул, но не упал насмерть — удалось ухватиться за корни у выступа! Вот бы подтянуться…\n• Взлом замка. Ты открыл дверь, но наделал шуму и привлёк внимание стражников…\n• Скрытность. Тебя заметили, но враг не поднял тревогу. Возможно, это союзник…?\n• Магические руны. Ты примерно понял, что это за руна, но попытка её отключить приведёт к непредсказуемому эффекту…\n• Укрытие от взрыва. Ты успел спрятаться, но обронил важный предмет…\n• Природа. Ты нашёл следы, но они ведут через опасную местность…\n\nЧтобы сохранить свободу выбора и создать более интересные ситуации, можно предложить герою последствия на выбор — принять их или провалиться:\n• «Тебе не дотянуть до края. Твой герой упадёт в тёмную яму или схватится за корни, уронив всё из рук или случайный предмет из рюкзака?»\n• «Этот замок не так-то просто взломать. Ты силой вскрываешь его — сломав отмычки; или ищешь другой путь?»\n• «Ты явно действуешь торговцу на нервы. Ты настаиваешь на скидке — в обмен на пожизненный запрет входить в его лавку; или платишь цену на которой он настаивает?»"

   "name": "Структура боя",

   "text": "Структура боя\n\nБоевое столкновение начинается, когда Мастер говорит группе: «Бросайте Инициативу!» Каждый герой бросает 1d20 и добавляет свой бонус Инициативы (обычно ЛВК). Однозначное число означает, что герой начинает бой с 1 действием. Двузначное — с 2 действиями. Результат 20+ (или натуральная 20) — все 3 действия!\n\nНезависимо от того, какое значение инициативы выпадет герою, в конце своего хода он получает обратно все 3 действия.\n\nВнезапность\n\nИногда группа действует настолько умело, что противник оказывается застигнут врасплох. В этом случае Мастер может предоставить группе преимущество в Инициативе, или, в крайних случаях, им вообще не нужно будет бросать кубик — Мастер может разрешить каждому герою начать со всеми тремя действиями!\n\nЕсли герои застигнуты врасплох, им, возможно, придётся бросать с помехой. Или, в крайних случаях, герои автоматически начинают бой с одним действием, или все монстры ходят первыми.\n\nЗамечание о неожиданности\nПросто быть спрятанным или нанести удар первым недостаточно, чтобы получить эффект неожиданности! Если противник настороже или хотя бы знает о твоём присутствии, его нельзя застать врасплох.\n\nПорядок хода\n\nКогда начинается бой, по умолчанию первыми ходят герои. Первым при этом ходит тот игрок, который первым будет готов (или тот, чей ход наиболее логичен с точки зрения сюжета), после этого игра продолжается по часовой стрелке вокруг стола.\n\nМонстры обычно ходят последними, хотя некоторые могут быть достаточно быстрыми, чтобы действовать раньше. Монстр (или группа монстров) ходит в одной и той же последовательности в каждом раунде.\n\nПоощряйте командную работу, будьте гибкими\nЕсли игроки хотят стратегически поменяться очередностью ходов на один раунд, чтобы реализовать тактический план, Мастер может разрешить это на своё усмотрение. Делать это стоит лишь изредка, чтобы не замедлять игру и не терять из виду, кто уже сделал ход.\n\nИграете виртуально?\nМожно ходить в порядке расположения веб-камер, в алфавитном порядке или любым другим удобным способом!\n\nХоды, Раунды и Столкновения\n\nХод — это когда один герой или группа монстров действуют. Типичный ход занимает примерно 6 секунд «игрового» времени. Раунд — это когда все игроки и монстры совершили свои ходы. Столкновение — это все раунды конкретного боя.\n\n1/Ход. Если ты используешь способность в свой ход и можешь найти способ использовать её в ход другого существа, ты можешь сделать это снова (например, Скрытая атака в сочетании с Атакой по возможности или Координированным ударом!).\n\n1/Раунд. Такие способности сбрасываются каждый раз, когда начинается твой ход (например, если ты используешь Защиту, ты не сможешь применить её снова, пока не наступит твой следующий ход).\n\nАктивность в течение нескольких ходов\n\nНекоторые активности стоят больше 1 действия. Ты можешь распределить их на несколько ходов в бою, если поддерживаешь Концентрацию и не совершаешь других действий или реакций в это время (кроме бесплатных).\n\nПример\nМаг по имени Бук хочет применить заклинание Удар ледника (3 действия), но у него осталось всего 1 действие. В этот ход он потратит 1 действие, чтобы начать применять заклинание, а в следующий ход — ещё 2, чтобы закончить его. Однако он рискует: он не может Защитить себя и, возможно, ему придётся полагаться на свою группу для защиты."
