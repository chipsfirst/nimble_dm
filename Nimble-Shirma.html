   "text": "Начинай с лёгкого.\nСоздавать идеально сбалансированные столкновения — навык, который приходит с практикой. Лучше ошибиться в сторону «слишком легко», чем «слишком сложно». У Мастера много способов повысить сложность по ходу игры, но мало способов снизить её, не ломая погружение.\n\nБаланс через тактику\n• Фокусировка огня. Концентрация атак на одном-двух героях делает столкновение сложнее. И наоборот — распределение урона или выход монстров волнами делает бой проще.\n• Движение. Монстры, которые двигаются каждый ход, заставляют героев ближнего боя перестраиваться и ограничивают их атаки. Это также создаёт возможности для реакций вроде атак по возможности. Чтобы снизить сложность — уменьши перемещение монстров.\n• Атакуй уязвимых. Заставь их тратить действия на защиту или бегство, прячась за спинами сильных союзников! Пусть танки гордятся Защитой и Вмешательством.\n• Корректируй инициативу. Чем раньше монстры действуют в раунде, тем сложнее столкновение, и наоборот. Если после хода первого игрока видно, что враги обречены — передвинь часть монстров вперёд в порядке инициативы, не дожидаясь конца раунда.\n• Расслабься! У героев достаточно инструментов для сложных ситуаций, так что не переживай из-за идеального баланса каждого столкновения. С опытом станет проще — и тебе, и игрокам.\n• Смерть героя — не конец. Если один (или все) герои погибли — это не провал. Предложи группе создать новых персонажей и нырнуть обратно в приключение.\n\nБаланс с миньонами\n\nМиньоны отлично подходят как массовка на поле боя, позволяя героям проявить свои сильные стороны. Бронированные защитники сдержат волны атак, а заклинатели уничтожат целые группы одним заклинанием. Миньоны делают бой динамичным и дают героям возможность блеснуть, сохраняя при этом быстрый и захватывающий темп.\n\nВолны миньонов.\nНачни с более лёгкого столкновения и вводи миньонов волнами, подбирая нужный уровень сложности. Миньоны могут появляться из укрытий или быть призванными посреди боя.\n• 1 миньон/герой: Чуть сложнее, но значительно расширяет тактические возможности.\n• 2–3 миньона/герой: Заметно сложнее.\n• 4 миньона на героя: Намного сложнее.\n\nИзбыточный урон\nХотя у миньонов нет хитов, ты можешь использовать размер их кости как меру стойкости. Избыточный урон от атаки может перейти на других миньонов в зоне досягаемости. Например, атака на 20 урона может уничтожить двух d10-миньонов или пятерых d4-миньонов.\n\nРекомендуемый размер кости миньонов по уровню группы\n\n| Уровень | Размер кости |\n| :---: | :------: |\n|  1-3  |    d4    |\n|  3-5  |    d6    |\n| 5-10  |    d8    |\n| 10-13 |   d10    |\n| 13-17 |   d12    |\n| 17-20 |   d20    |"

   "text": "Большинство столкновений начинаются так: герои и враги знают друг о друге, находятся в одном-двух перемещениях друг от друга, и 1–4 подходящих по уровню врага на каждого героя сражаются насмерть. Эта формула работает, но время от времени разнообразие сделает столкновение более запоминающимся. Вот способы добавить остроты:\n• Засада (враги)! Лёгкое столкновение становится сложнее и азартнее, когда враги застают героев врасплох. Размести скрытых врагов рядом с группой и дай им действовать первыми (только убедись, что есть сюжетная причина для засады или шанс её заметить!).\n• Засада (герои)! Крайне сложное столкновение, но герои получают время на разведку, изучение слабостей, расстановку ловушек и препятствий или даже выбор поля боя (плюс полный ход до того, как враги смогут действовать).\n• Отдача. Герои получают урон при определённых действиях (колдовство, использование оружия, движение или особые способности).\n• Предательство! Союзный Персонаж Мастера внезапно нападает на героев посреди боя (временно или навсегда).\n• Не достанешь! Относительно слабые враги на выгодной высоте, способные сбрасывать тяжёлые предметы на героев. Или вне досягаемости ближнего боя героев и с отличным укрытием от дальнобойных атак.\n• Захват флага. Герои должны завладеть предметом (и удержать), который отчаянно нужен врагам.\n• Очарованные союзники. Враги накладывают мощные чары или иллюзии на одного или нескольких героев, заставляя группу сражаться со своими и одновременно пытаться снять заклинание.\n• Оборона крепости. Герои должны защищать позицию определённое число раундов, пока не подоспеет подкрепление.\n• Разделённая верность. Две вражеские фракции сражаются друг с другом, когда появляются герои. Группа может выждать, пока фракции ослабят друг друга, использовать хаос в свою пользу или атаковать обе стороны.\n• Союзник из обстановки. Герои получают преимущество от окружения: бешеный зверь, рушащаяся постройка или стихийное бедствие помогают переломить ход боя. Обязательно подготовь событие и дай героям предугадать эффектный момент, иначе они почувствуют себя обманутыми.\n• Катастрофа. Само окружение — главная угроза: реки лавы, метательные взрывающиеся грибы, обвалы пещер, тонущий корабль.\n• Разъярённые враги. Каждый раз, когда что-то происходит (враг получает урон, теряет союзника и т.д.), их урон растёт.\n• Призрачные враги. Враги — призраки, тени или другие бесплотные существа, которые перемещаются между планами. Они невосприимчивы к урону в определённые фазы, вынуждая героев подстраивать тайминг и тактику.\n• Кровная месть. Лёгкое столкновение, но все враги атакуют ТОЛЬКО одного героя. Возможно, за его голову назначена награда, он оскорбил военачальника или проклят? Убедись, что игроки заранее знают ситуацию, чтобы это не казалось нечестным. Группе придётся радикально изменить привычную тактику.\n• Иллюзорные враги. Враги создают иллюзии: атаки промахиваются чаще или перенаправляются на союзников. Нужно разглядеть иллюзии и убедиться, что бьёшь по правильной цели.\n• Неминуемая гибель. Столкновение, которое было бы слишком сложным, но герои получают дополнительный раунд или два до того, как враги смогут полноценно вступить в бой. Враги без дальнобойных атак начинают очень далеко, враги, которым нужно проснуться или «зарядиться» перед действием.\n• Непрошеные гости. Другая фракция появляется, пока герои уже в бою. Враги просят о помощи — герои могут сражаться с обеими сторонами или убедить новоприбывших встать на свою сторону.\n• Манашторм. Все заклинания стоят меньше маны, вплоть до 0. Колдовство может наносить урон заклинателю вместо эффекта (например, 1d6 за потраченную ману).\n• Воздушный бой. Летающие враги, нелетающие герои — отличная классика. Особенно когда враги могут подхватить героя, взлететь и позволить гравитации сделать остальное. Или наоборот — дай героям полёт и позволь им обстреливать врагов сверху.\n• Верхом! Герои сражаются верхом на скачущих, карабкающихся, летящих или плывущих зверях!\n• Движущаяся угроза. Герои сражаются на рушащемся мосту, в горящем здании или на поле боя под обстрелом осадных орудий. Нужно постоянно двигаться — или погибнуть!\n• Мирные жители. Враги перемешаны с невинными прохожими или другими ценными объектами, которые нельзя повредить.\n• Ой, одни миньоны! Герои могут столкнуться с ОГРОМНЫМ количеством миньонов. Этот формат сияет, когда у героев есть способности области и они умеют грамотно позиционироваться.\n• Кромешная тьма. Монстры атакуют в темноте, герои не видят, любые источники света магически гаснут. Нельзя использовать Вмешательство или Защиту против невидимых атак.\n• Плохая тактика (глупые враги). Очень сложное столкновение, но враги изо всех сил распределяют урон поровну между героями и допускают очевидные тактические ошибки.\n• Столкни его! Бой на большой высоте, где самый эффективный способ победить (или проиграть) — столкнуть противника с края или где принудительное перемещение особенно выгодно.\n• Бой-головоломка. Загадка, которую нужно решить в бою: враги невосприимчивы, пока стоят в определённом месте, или пока не выключен/уничтожен механизм, или не прерван ритуал.\n• Подкрепление! Враги убегают за подмогой, когда окровавлены или потеряли половину бойцов.\n• Разделяй группу! Физически раздели группу интересным способом: бойцы ближнего боя по одну сторону, дальнобойные — по другую; заставь их сражаться непривычным способом.\n• Тихое устранение. Громкие звуки привлекают больше врагов!\n• Шипы. У врагов мало Хитов; избыточный урон возвращается героям.\n• Теснота. Необычно маленькая комната/площадка или место, забитое препятствиями.\n• Ловушки повсюду! Место, полное ловушек и опасностей окружения, которые можно использовать против героев или врагов.\n• Перебежчики. Враги (честно или нечестно) предлагают помочь героям против общего противника или угрозы.\n• Бой на транспорте. Герои сражаются с врагами, управляя транспортом на полной скорости.\n• Волна за волной. Герои могут столкнуться с НАМНОГО большим числом врагов, если те появляются постепенно, а не все сразу. Добавляй…"
  },
  {
   "name": "Управление легендарными монстрами",
   "cat": "Монстры",
   "text": "Большинство боёв — герои против группы монстров, но иногда сюжет требует одиночного противника. Однако против одного врага герои выдают огромный урон и быстро расправляются даже с очень сильным противником. Поэтому одиночные монстры почти всегда должны быть Легендарными.\n\nГерои должны знать, когда они сражаются с Легендарным существом. Это не должно случаться каждую сессию — такие столкновения стоит приберечь для по-настоящему важного боя. Это ТОТ САМЫЙ СТРАШНЫЙ ДРАКОН, именной босс или Главный злодей. У Легендарного монстра есть несколько важных особенностей:\n\nЛегендарные монстры действуют после хода КАЖДОГО героя. Это создаёт новые тактические возможности и сложности для группы и помогает балансировать столкновение для разного числа игроков.\n\nДействует после каждого хода?\nА если толпа из 100 простолюдинов атакует дракона, он что, двигается со скоростью света после хода каждого из них?! Нет. Только после ходов героев. Простолюдины, миньоны и прочие последователи — не герои. Как Мастер, руководствуйся здравым смыслом и смело отменяй любое правило, которое не нравится твоей группе или не имеет смысла в игровом мире.\n\nУ них есть интересные механики и слабости, которые можно раскрыть через исследование заранее или с помощью действия Оценка в бою.\n\nСпасброски\nКак и у героев, у Легендарных монстров есть спасброски с преимуществом (+) или помехой (−). Например, СИЛ++, ВОЛ− означает, что монстр бросает спасброски Силы с преимуществом 2 (две дополнительные кости), а спасброски Воли — с помехой.\n\nОкровавлен\nМонстр получает дополнительную опасную способность, когда его Хиты падают до половины.\n\nПоследний рубеж\nКогда Хиты падают до 0, легендарный монстр оказывается При смерти и получает опасные новые способности. Монстр умирает окончательно, когда получает ещё немного урона. Переломы в ходе легендарной битвы сделают её незабываемой!\n\nОпциональные действия\nУ каждого легендарного монстра также есть действия по умолчанию, чтобы вселить страх или перемещать игроков вместо обычных атак. Отличный способ добавить драмы или смягчить слишком сложное столкновение. Например:\n\n Замах/Глубокий вдох. Восстановить использование одноразовой способности.\n Ужасающий рёв/Зловещий монолог/Провокация. Существа, которые слышат это, бросают спасбросок ВОЛ; при провале — Испуган на 1 ход.\n Отбросить/Телекинетический толчок. Спасбросок СИЛ или перемещение, Сбит с ног и т.д.\n Прицелиться/Найти слабость/Прижать. Спасбросок ЛВК, следующая атака монстра — с преимуществом и не может быть перекрыта Вмешательством."

  {
   "name": "Управление монстрами",
   "cat": "Монстры",
   "text": "Мастер управляет монстрами в бою. Монстры не используют Действия/Реакции героев. Они могут двигаться, использовать действия из своего статблока — и на этом их ход заканчивается. Монстры погибают, когда Хиты опустятся до 0.\n\nБроня монстров\nБольшинство монстров не имеют брони, но некоторых существ сложнее убить:\n• Средняя броня (С): Только кости. Монстры со Средней бронёй игнорируют все модификаторы урона от характеристик и других эффектов — получают урон только от суммы костей.\n• Тяжёлая броня (Т): Половина костей. Монстры с Тяжёлой бронёй игнорируют модификаторы урона и получают половину суммы костей (с округлением вверх).\n\nРасскажи игрокам!\nБроня монстра не должна быть секретом. Обычные гоблины без брони. Вот тот гоблин? Он держит щит — у него Средняя броня. Голем целиком из металла? Тяжёлая броня.\n\nКак справиться с бронёй?\nКритические попадания героев, некоторые заклинания и уязвимости к типам урона полностью игнорируют броню монстра. Это значит, что определённое оружие и заклинания эффективнее или слабее против бронированных врагов! Отличный повод напомнить игрокам о действии Оценка.\n\nБроня монстров и броня героев\nПочему они работают по-разному? Мастеру и без того есть за чем следить — не хватало ещё десяток раз за раунд решать, Защищаться ли от очередной атаки. У героя персонаж один, и лишняя тактическая глубина ему не в тягость, а в радость.\n\nХарактеристики монстров по умолчанию\nЕсли не указано иное, монстры среднего размера, без брони, со скоростью 6 (могут заменить атаку на повторное движение или заменить любое из этих действий на повторный спасбросок), атаки имеют Досягаемость 1, и бросают 1d20 на все спасброски (хотя некоторые монстры могут иметь преимущество/помеху на определённые спасброски или проверки)."

   "name": "Характеристики",
   "cat": "Герои",
   "text": "У героев 4 характеристики, влияющие на эффективность в различных задачах: 2 ключевые характеристики, имеющие решающее значение для их класса, и 2 второстепенные характеристики. Обычно максимальное значение характеристик героя составляет +5.\n\nКЛЮЧ.\nКогда способность или заклинание ссылается на КЛЮЧ, используй одну из ключевых характеристик. Если характеристика указана перед броском кубика, брось количество кубиков, равное этой характеристике. Например, ВОЛ d8 означает: если ВОЛ равна 2, бросай 2d8 (две восьмигранных кости).\n\nСила (СИЛ)\nФизическая сила и выносливость, стойкость и сопротивление вреду. Влияет на урон оружием СИЛ, сопротивление Ранениям, восстановление Хитов, Концентрацию, спасброски СИЛ, грузоподъёмность, Захват и навык Мощь.\n\nЛовкость (ЛВК)\nРефлексы, подвижность и точность при обращении с клинком или луком. Влияет на урон оружием ЛВК, инициативу, спасброски ЛВК, Захват, навыки Скрытность и Сноровка. Может влиять на Броню.\n\nИнтеллект (ИНТ)\nХарактеризует знания и способность к рассуждению в таких областях, как магия, тактика или житейская мудрость. Влияет на языки, заклинания, использование волшебных палочек, свитков заклинаний, спасброски ИНТ, а также на навыки Магия, Анализ и Знания.\n\nВоля (ВОЛ)\nСила характера, смелость и мудрость. Воля определяет, как ты ладишь с природой и обществом. Влияет на заклинания, спасброски ВОЛ, а также на навыки Интуиция, Влияние, Природа и Восприятие."

   "name": "Хиты, смерть и ранения",
   "cat": "Бой",
   "text": "Хиты отражают способность выдерживать урон. Урон уменьшает хиты (ниже 0 они не опускаются).\n\nУпав до 0 хитов, герой получает 1 Ранение. Также он получает состояние При смерти — пока не восстановит хиты. При смерти действия ограничены до 1, Концентрация прерывается, и герой рискует получить ещё более серьёзный вред:\n Атакуя или Колдуя при смерти, герой получает 1 ранение, если не пройдёт спасбросок СИЛ Сл 10.\n Урон, полученный при смерти, наносит 2 ранения; критический удар — 3.\n\nРанения\nРанения — серьёзные травмы; это долгосрочный показатель того, насколько герой близок к смерти. Хиты обычно восстанавливаются быстро, но ранения могут заживать много дней отдыха (обычно 1 ранение за Безопасный Отдых).\n\nСмерть\nГерой умирает, получив 6 ранений (если только какое-то умение не меняет это число). Существуют способы воскресить погибшего героя, но они редки и часто требуют очень высокой цены.\n\nВременные хиты\nНекоторые умения или эффекты дают временные хиты — они расходуются первыми при получении урона. Временные хиты не складываются: если у героя уже есть временные хиты и он получает новые, он выбирает, какие оставить. Они пропадают после Безопасного Отдыха.\n\nСуровые правила смерти\nДополнительные правила для более жёсткой или «олдскульной» игры: можно уменьшить максимум ранений. От 5 ранений для чуть более сложной игры до 1–2 ранений для по-настоящему смертельной!\nТакже можно сделать так, чтобы каждое ранение давало накопительный штраф –1 к броскам: проверкам навыков, спасброскам или даже ВСЕМ броскам! (Если ты настоящий любитель страданий.)"

<script>/* ================= Core: state, storage, utilities, dice, shell ================= */
const DATA = window.NIMBLE_DATA;
const STORAGE_KEY = "nimble.shirma.v1";
const $ = (sel, root = document) => (root || document).querySelector(sel);
const $$ = (sel, root = document) => Array.from((root || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const plural = (n, one, few, many) => { const m = Math.abs(n) % 100, d = m % 10; if (m > 10 && m < 20) return many; if (d === 1) return one; if (d > 1 && d < 5) return few; return many; };
const fmtDate = (ts) => new Date(ts).toLocaleDateString("ru-RU", { day: "2-digit", month: "short" });
const fmtDateTime = (ts) => new Date(ts).toLocaleString("ru-RU", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtTimeShort = (ts) => new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
const timeAgo = (ts) => {
  const d = Date.now() - ts;
  if (d < 60000) return "только что";
  if (d < 3600000) return Math.floor(d / 60000) + " мин назад";
  if (d < 86400000) return Math.floor(d / 3600000) + " ч назад";
  return fmtDate(ts);
};

const STAT_IDS = ["STR", "DEX", "INT", "WIL"];
const STAT_NAME = { STR: "Сила", DEX: "Ловкость", INT: "Интеллект", WIL: "Воля" };
const STAT_SHORT = { STR: "СИЛ", DEX: "ЛВК", INT: "ИНТ", WIL: "ВОЛ" };

const defaultState = () => ({
  chars: [],
  combat: { active: false, round: 1, turn: 0, combatants: [], started: null },
  reminders: [],
  notes: [],
  rolls: [],
  custom: [],
  ui: { tab: "screen", refType: "all", refQuery: "", refSel: null, noteId: null, charId: null, diceFaces: 20, diceCount: 1, diceMod: 0, diceMode: "normal", diceFormula: "" }
});

let state = loadState();

function loadState() {
  const base = defaultState();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return base;
    const p = JSON.parse(raw);
    return {
      ...base,
      ...p,
      combat: { ...base.combat, ...(p.combat || {}), combatants: Array.isArray(p.combat?.combatants) ? p.combat.combatants : [] },
      ui: { ...base.ui, ...(p.ui || {}) },
      chars: Array.isArray(p.chars) ? p.chars : [],
      reminders: Array.isArray(p.reminders) ? p.reminders : [],
      notes: Array.isArray(p.notes) ? p.notes : [],
      rolls: Array.isArray(p.rolls) ? p.rolls : [],
      custom: Array.isArray(p.custom) ? p.custom : []
    };
  } catch (e) {
    console.warn("Не удалось прочитать сохранение", e);
    return base;
  }
}

let saveTimer = null;
function save(immediate = false) {
  clearTimeout(saveTimer);
  const write = () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const el = $("#saveState");
      if (el) el.textContent = "Сохранено в " + fmtTimeShort(Date.now());
    } catch (e) {
      const el = $("#saveState");
      if (el) el.textContent = "Не удалось сохранить в браузере";
    }
  };
  if (immediate) write();
  else saveTimer = setTimeout(write, 250);
}

/* ---------------- Dice engine ---------------- */
function substituteFormula(formula, stats) {
  if (!stats) return formula;
  const map = {
    STR: stats.STR, DEX: stats.DEX, INT: stats.INT, WIL: stats.WIL,
    "СИЛ": stats.STR, "ЛВК": stats.DEX, "ИНТ": stats.INT, "ВОЛ": stats.WIL,
    KEY: stats.KEY != null ? stats.KEY : Math.max(stats.STR || 0, stats.DEX || 0, stats.INT || 0, stats.WIL || 0),
    LVL: stats.LVL != null ? stats.LVL : 1, "УР": stats.LVL != null ? stats.LVL : 1
  };
  return String(formula).replace(/\b(STR|DEX|INT|WIL|KEY|LVL|СИЛ|ЛВК|ИНТ|ВОЛ|УР)\b/g, (m) => (map[m] == null ? 0 : map[m]));
}

function rollDie(faces) { return 1 + Math.floor(Math.random() * faces); }

function rollFormula(formula, opts = {}) {
  const raw = substituteFormula(formula || "1d20", opts.stats);
  const mode = opts.mode || "normal";
  const extra = Math.max(0, Number(opts.extra != null ? opts.extra : (mode === "normal" ? 0 : 1)) || 0);
  const cleaned = raw.replace(/\s+/g, "").replace(/—/g, "-");
  if (!/^[+\-]?(\d*d\d+|\d+)([+\-](\d*d\d+|\d+))*$/i.test(cleaned)) {
    return { error: "Не понял формулу. Пример: 2d6+3 или d20+5." };
  }
  const terms = cleaned.match(/[+\-]?[^+\-]+/g) || [];
  const parts = [];
  let total = 0;
  let signed = 1;
  let primary = null;
  let primaryFaces = null;
  let flatMod = 0;
  terms.forEach((term) => {
    let t = term;
    let sign = 1;
    if (t[0] === "+") t = t.slice(1);
    else if (t[0] === "-") { sign = -1; t = t.slice(1); }
    const dm = t.match(/^(\d*)d(\d+)$/i);
    if (dm) {
      let count = dm[1] ? parseInt(dm[1], 10) : 1;
      const faces = parseInt(dm[2], 10);
      if (!count || count > 100) count = 1;
      if (faces < 2 || faces > 1000) return;
      let vals;
      let kept;
      if (faces === 44 || faces === 66 || faces === 88) {
        const sides = faces / 11;
        const a = rollDie(sides), b = rollDie(sides);
        vals = [a, b];
        kept = [a, b];
        const v = a * 10 + b;
        total += sign * v;
        parts.push({ kind: "digit", faces, vals, kept, value: v, sign });
      } else {
        vals = Array.from({ length: count }, () => rollDie(faces));
        kept = vals.slice();
        if (faces === 20 && extra > 0) {
          const rolled = Array.from({ length: count + extra }, () => rollDie(faces));
          vals = rolled;
          const sorted = rolled.slice().sort((x, y) => (mode === "adv" ? y - x : x - y));
          kept = sorted.slice(0, count);
        }
        const sum = kept.reduce((s, v) => s + v, 0);
        total += sign * sum;
        parts.push({ kind: "dice", faces, vals, kept, value: sum, sign });
        if (primary === null) { primary = kept[0]; primaryFaces = faces; }
      }
      return;
    }
    const flat = parseInt(t, 10);
    if (!isNaN(flat)) {
      flatMod += sign * flat;
      total += sign * flat;
      parts.push({ kind: "mod", value: sign * flat });
    }
  });

  let crit = false, miss = false;
  if (opts.attack && primaryFaces && primary != null) {
    crit = primary === primaryFaces;
    miss = primary === 1;
    if (crit) {
      const bonus = rollDie(primaryFaces);
      parts.push({ kind: "crit", faces: primaryFaces, vals: [bonus], kept: [bonus], value: bonus, sign: 1 });
      total += bonus;
    }
  }

  const detail = describeRoll(parts, raw);
  return { total, parts, detail, crit, miss, formula: raw, primary, primaryFaces };
}

function describeRoll(parts, formula) {
  const chunks = [];
  parts.forEach((p, i) => {
    if (p.kind === "mod") {
      chunks.push((p.value >= 0 ? "+" : "−") + Math.abs(p.value));
    } else if (p.kind === "dice" || p.kind === "digit") {
      const sign = i === 0 || p.sign > 0 ? "" : "−";
      if (p.kind === "digit") {
        chunks.push(sign + "[" + p.vals[0] + "|" + p.vals[1] + "]→" + p.value);
      } else {
        const dropped = p.vals.filter((v, idx) => {
          const used = p.kept.slice();
          const j = used.indexOf(v);
          if (j >= 0) { used.splice(j, 1); return false; }
          return true;
        });
        let inner = p.kept.join(" + ");
        if (dropped.length) inner = p.kept.map((v) => "[" + v + "]").join(" + ") + " (отброшено " + dropped.join(", ") + ")";
        chunks.push(sign + inner);
      }
    } else if (p.kind === "crit") {
      chunks.push("крит +[" + p.value + "]");
    }
  });
  return formula + " = " + (chunks.join(" ") || "0");
}

function pushRoll(label, res, meta = {}) {
  if (res.error) { toast(res.error, "warn"); return; }
  state.rolls.unshift({ id: uid(), label, total: res.total, detail: res.detail, crit: res.crit, miss: res.miss, ts: Date.now(), ...meta });
  state.rolls = state.rolls.slice(0, 60);
  save();
}

/* ---------------- UI primitives ---------------- */
function toast(text, kind = "info") {
  const host = $("#toasts");
  if (!host) return;
  const node = document.createElement("div");
  node.className = "toast";
  const icon = kind === "warn" ? "i-bolt" : "i-check";
  node.innerHTML = `<svg class="ico" aria-hidden="true"><use href="#${icon}"/></svg><div>${text}</div>`;
  host.appendChild(node);
  setTimeout(() => { node.style.opacity = "0"; node.style.transition = "opacity .25s"; }, 3600);
  setTimeout(() => node.remove(), 4000);
}

function openModal({ title, body, footer, wide = false, onMount }) {
  const root = $("#modalRoot");
  root.hidden = false;
  root.innerHTML = `<div class="modal-scrim" data-close-modal></div>
    <section class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <header class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" type="button" aria-label="Закрыть" data-close-modal><svg class="ico"><use href="#i-close"/></svg></button></header>
      <div class="modal-body">${body || ""}</div>
      ${footer ? `<footer class="modal-foot">${footer}</footer>` : ""}
    </section>`;
  document.body.style.overflow = "hidden";
  ensureLabels(root);
  if (onMount) onMount(root);
  const first = root.querySelector("input, select, textarea, button.btn");
  if (first) setTimeout(() => first.focus(), 40);
}

function closeModal() {
  const root = $("#modalRoot");
  if (!root) return;
  root.hidden = true;
  root.innerHTML = "";
  document.body.style.overflow = "";
}

function openDrawer(html, title = "") {

  d.hidden = false;
  document.body.style.overflow = "hidden";
  ensureLabels(d);
  const panel = d.querySelector(".drawer-panel");
  if (panel) panel.scrollTop = 0;
}

function closeDrawer() {
  const d = $("#drawer");
  if (!d) return;
  d.hidden = true;
  $("#drawerBody").innerHTML = "";
  if ($("#modalRoot").hidden) document.body.style.overflow = "";
}

const ACTIONS = (window.ACTIONS = window.ACTIONS || {});
function reg(name, fn) { ACTIONS[name] = fn; }

/* ---------------- Shell & routing ---------------- */
const VIEWS = {};
function registerView(name, fn) { VIEWS[name] = fn; }
const BINDERS = {};
function onBind(tab, fn) { BINDERS[tab] = fn; }
function bindView(tab) { if (BINDERS[tab]) BINDERS[tab](); }

function go(tab) {
  state.ui.tab = tab;
  save();
  $$("#tabs .tab").forEach((b) => {
    const on = b.dataset.tab === tab;
    b.classList.toggle("is-active", on);
    b.setAttribute("aria-current", on ? "page" : "false");
  });
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}


function ensureLabels(root) {
  const scope = root || document;
  scope.querySelectorAll("input, select, textarea").forEach((el) => {
    if (el.getAttribute("aria-label") || el.getAttribute("aria-labelledby")) return;
    if (el.id && scope.querySelector(`label[for="${el.id}"]`)) return;
    if (el.closest("label") || el.title) return;
    const hint = el.getAttribute("placeholder") || el.dataset.ui || el.type || "Поле ввода";
    el.setAttribute("aria-label", String(hint));
  });
}

function syncTabs() {
  $$("#tabs .tab").forEach((b) => {
    const on = b.dataset.tab === (state.ui.tab || "screen");
    b.classList.toggle("is-active", on);
    b.setAttribute("aria-current", on ? "page" : "false");
  });
}

function render() {
  const view = $("#view");
  if (!view) return;
  const tab = state.ui.tab || "screen";
  syncTabs();
  const fn = VIEWS[tab] || VIEWS.screen;
  view.innerHTML = fn ? fn() : "";
  if (typeof bindView === "function") bindView(tab);
  ensureLabels();
  updateBadges();
}

function updateBadges() {
  const rem = state.reminders.filter((r) => !r.done && isReminderDue(r)).length;
  const remBadge = $("#remBadge");
  if (remBadge) { remBadge.hidden = !rem; remBadge.textContent = rem; }
  const badge = $("#combatBadge");
  if (badge) {
    const n = state.combat.active ? state.combat.combatants.filter((c) => c.hp > 0).length : 0;
    badge.hidden = !n;
    badge.textContent = n;
  }
}

/* ---------------- Derived character helpers ---------------- */
function charById(id) { return state.chars.find((c) => c.id === id); }
function classByName(name) { return DATA.classes.find((c) => c.name === name); }

function armorOf(ch) {
  const f = (ch.armorFormula || "").trim();
  if (!f) return Number(ch.armorValue) || 0;
  const dex = Number(ch.dex) || 0;
  const m = f.match(/^(\d+)\s*(?:\+\s*(?:ЛВК|DEX)(?:\s*\(макс\.?\s*(\d+)\))?)?/i);
  if (!m) return Number(ch.armorValue) || 0;
  let base = parseInt(m[1], 10) || 0;
  if (m[2]) base += Math.min(dex, parseInt(m[2], 10));
  else if (/ЛВК|DEX/i.test(f)) base += dex;
  return base;
}

function hitDieMax(ch) {
  const cls = classByName(ch.class);
  const die = parseInt(String(cls?.hitDie || "d8").replace("d", ""), 10) || 8;
  return die;
}

function suggestedHp(clsName, level) {
  const cls = classByName(clsName);
  if (!cls) return 10;
  const die = parseInt(String(cls.hitDie || "d8").replace("d", ""), 10) || 8;
  return cls.hp + (Math.max(1, level) - 1) * (Math.floor(die / 2) + 1);
}

function charSummary(ch) {
  const cls = classByName(ch.class);
  const parts = [ch.ancestry, ch.class, ch.level ? "ур. " + ch.level : "", cls?.hitDie];
  if (ch.background) parts.splice(1, 0, ch.background);
  return parts.filter(Boolean).join(" · ");
}

function skillTotal(ch, skill) {
  const pts = Number(ch.skills?.[skill.name] || 0);
  return (Number(ch[skill.stat.toLowerCase()]) || 0) + pts;
}

function charStats(ch) {
  return {
    STR: Number(ch.str) || 0, DEX: Number(ch.dex) || 0, INT: Number(ch.int) || 0, WIL: Number(ch.wil) || 0,
    LVL: Number(ch.level) || 1, KEY: Math.max(Number(ch.str) || 0, Number(ch.dex) || 0, Number(ch.int) || 0, Number(ch.wil) || 0)
  };
}

/* ---------------- Combat helpers ---------------- */
function sortCombatants() {
  state.combat.combatants.sort((a, b) => (b.init || 0) - (a.init || 0) || a.name.localeCompare(b.name, "ru"));
}
function currentCombatant() {
  if (!state.combat.active) return null;
  return state.combat.combatants[state.combat.turn] || null;
}
function combatAlive() { return state.combat.combatants.filter((c) => c.hp > 0); }

/* ---------------- Reminder helpers ---------------- */
function isReminderDue(r) {
  if (r.mode === "time" && r.due) return Number(r.due) <= Date.now();
  if (r.mode === "round" && state.combat.active && r.every) return state.combat.round % Number(r.every) === 0;
  return false;
}
function reminderLabel(r) {
  if (r.mode === "time" && r.due) {
    const diff = Number(r.due) - Date.now();
    if (r.done) return "выполнено";
    if (diff <= 0) return "просрочено";
    const m = Math.floor(diff / 60000);
    if (m < 60) return "через " + m + " мин";
    const h = Math.floor(m / 60);
    if (h < 24) return "через " + h + " ч " + (m % 60) + " мин";
    return "через " + Math.floor(h / 24) + " дн";
  }
  if (r.mode === "round") return "каждые " + r.every + " " + plural(r.every, "раунд", "раунда", "раундов");
  return "вручную";
}

/* ---------------- Reference index ---------------- */
let REF_INDEX = null;
const TYPE_LABEL = {
  rule: "Правило", condition: "Состояние", weapon: "Оружие", armor: "Броня", gear: "Снаряжение",
  magic: "Магические предметы", monster: "Существо", spell: "Заклинание", class: "Класс", ancestry: "Предок", background: "Предыстория", custom: "Своё"
};
function refIndex() {
  if (REF_INDEX) return REF_INDEX;
  const idx = [];
  DATA.rules.forEach((r) => idx.push({ type: "rule", name: r.name, sub: r.cat, text: r.text, raw: r }));
  DATA.conditions.forEach((c) => idx.push({ type: "condition", name: c.name, sub: "", text: c.desc, raw: c }));
  DATA.weapons.forEach((w) => idx.push({ type: "weapon", name: w.name, sub: w.cat + " · " + w.dice + "+" + w.stat + " " + w.type, text: (w.props || []).join(", "), raw: w }));
  DATA.armor.forEach((a) => idx.push({ type: "armor", name: a.name, sub: a.cat, text: a.armor, raw: a }));
  DATA.gear.forEach((g) => idx.push({ type: "gear", name: g.name, sub: g.cost, text: g.desc, raw: g }));
  DATA.magic.forEach((m) => idx.push({ type: "magic", name: m.name, sub: m.rarity, text: m.desc, raw: m }));
  DATA.monsters.forEach((m) => idx.push({ type: "monster", name: m.name, sub: "ур. " + m.lvl + (m.hp ? " · " + m.hp + " хитов" : " · миньон"), text: (m.actions || []).map((a) => a.n).join(", "), raw: m }));
  DATA.spells.forEach((s) => idx.push({ type: "spell", name: s.name, sub: s.school + " · тир " + s.tier, text: s.text, raw: s }));
  DATA.classes.forEach((c) => idx.push({ type: "class", name: c.name, sub: "Хиты " + c.hp + " · " + c.hitDie, text: c.role, raw: c }));
  DATA.ancestries.forEach((a) => idx.push({ type: "ancestry", name: a.name, sub: a.size, text: a.trait, raw: a }));
  (DATA.backgrounds || []).forEach((b) => idx.push({ type: "background", name: b.name, sub: "Предыстория", text: b.text, raw: b }));
  state.custom.forEach((c) => {
    if (c.kind === "monster") {
      const raw = typeof parseCustomMonster === "function" ? parseCustomMonster(c) : c;
      idx.push({ type: "monster", name: c.name, sub: "своё · ур. " + (c.lvl || "1") + (c.hp ? " · " + c.hp + " хит" : ""), text: c.text || "", raw });
    } else if (c.kind === "weapon") {
      idx.push({ type: "weapon", name: c.name, sub: "своё · " + (c.dice || "1d6"), text: ((c.props || []).join(", ")), raw: { id: c.id, name: c.name, dice: c.dice || "1d6", stat: c.stat || "", type: c.wtype || "", cost: c.cost || "", props: c.props || [], cat: "Своё оружие" } });
    } else {
      idx.push({ type: "custom", id: c.id, name: c.name, sub: c.sub || "своя запись", text: c.text || "", raw: c });
    }
  });
  REF_INDEX = idx;
  return idx;
}
function rebuildRefIndex() { REF_INDEX = null; }

function searchRefs(q, type = "all") {
  const query = (q || "").trim().toLowerCase();
  let list = refIndex();
  if (type !== "all") list = list.filter((e) => e.type === type);
  if (!query) return list.slice().sort((a, b) => a.name.localeCompare(b.name, "ru"));
  const words = query.split(/\s+/).filter(Boolean);
  const scored = [];
  list.forEach((e) => {
    const hay = norm(e.name + " " + (e.sub || "") + " " + (e.text || ""));
    let score = 0;
    if (norm(e.name).startsWith(query)) score += 120;
    else if (norm(e.name).includes(query)) score += 80;
    words.forEach((w) => { if (hay.includes(w)) score += 18; });
    if (score) scored.push([score, e]);
  });
  return scored.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name, "ru")).map((x) => x[1]);
}
function norm(s) { return String(s || "").toLowerCase().replace(/ё/g, "е"); }

<script>/* ================= Ширма и кубики ================= */
function initials(name) {
  const parts = String(name || "?").trim().split(/\s+/);
  return (parts[0][0] || "?").toUpperCase() + (parts[1] ? parts[1][0].toUpperCase() : "");
}
function hpClass(hp, max) {
  const r = max ? hp / max : 0;
  if (r <= 0.25) return "crit";
  if (r <= 0.5) return "warn";
  return "";
}
function reminderSort(a, b) {
  const rank = (r) => (r.done ? 2 : isReminderDue(r) ? 0 : 1);
  const ra = rank(a), rb = rank(b);
  if (ra !== rb) return ra - rb;
  if (a.mode === "time" && b.mode === "time") return (a.due || 0) - (b.due || 0);
  return (a.created || 0) - (b.created || 0);
}
function charHpLine(ch) {
  const max = Number(ch.maxHp) || 0;
  const hp = clamp(Number(ch.hp) || 0, 0, max || 999);
  const pct = max ? Math.round((hp / max) * 100) : 0;
  return `<div class="hp-bar"><div class="hp-fill ${hpClass(hp, max)}" style="width:${pct}%"></div></div>`;
}

}

        <div class="dice-row">
          <div class="adv-toggle" role="group" aria-label="Режим броска">
            <button type="button" data-act="dice-mode" data-mode="dis" class="${mode === "dis" ? "on" : ""}">Помеха</button>
            <button type="button" data-act="dice-mode" data-mode="normal" class="${mode === "normal" ? "on" : ""}">Обычный</button>
            <button type="button" data-act="dice-mode" data-mode="adv" class="${mode === "adv" ? "on" : ""}">Преимущество</button>
          </div>
          <label class="check" style="margin-left:4px"><input type="checkbox" id="diceAttack" ${ui.diceAttack ? "checked" : ""}> считать атакой</label>
          <button class="btn btn-primary" type="button" data-act="dice-roll" style="margin-left:auto"><svg class="ico"><use href="#i-d20"/></svg>Бросить</button>
        </div>
        <div id="diceResult" class="roll-result" hidden></div>
      </div>
    </section>

    <div class="stack">
      <section class="card">
        <div class="card-head"><h2>Быстрые кости</h2><span class="count">1 бросок</span></div>
        <div class="card-body">
          <div class="quick-rolls">
            ${[4, 6, 8, 10, 12].map((d) => `<button class="qroll" type="button" data-act="quick-die" data-faces="${d}"><b>d${d}</b><span>кость</span></button>`).join("")}
          </div>
          <div class="quick-rolls" style="margin-top:7px">
            <button class="qroll" type="button" data-act="quick-die" data-faces="20"><b>d20</b><span>проверка</span></button>
            <button class="qroll" type="button" data-act="quick-die" data-faces="100"><b>d100</b><span>процент</span></button>
            <button class="qroll" type="button" data-act="quick-die" data-faces="66"><b>d66</b><span>цифры</span></button>
            <button class="qroll" type="button" data-act="quick-die" data-faces="88"><b>d88</b><span>цифры</span></button>
          </div>
          <p class="hint">Цифровые кости d44/d66/d88: две кости, первая — десятки, вторая — единицы. Они не промахиваются и не критуют.</p>
        </div>
      </section>

      <section class="card card-flush">
        <div class="card-head"><h2>История</h2><span class="count">${state.rolls.length}</span>
          <button class="card-link" type="button" data-act="rolls-clear">очистить</button>
        </div>
        ${state.rolls.length ? `<div class="rolls" style="max-height:330px;overflow:auto">${state.rolls.slice(0, 20).map((r) => `<div class="roll-item">
          <span class="t">${fmtTimeShort(r.ts)}</span>
          <span class="lbl" title="${esc(r.detail)}">${esc(r.label)}</span>
          <span class="val ${r.crit ? "crit" : ""}">${r.total}</span>
        </div>`).join("")}</div>` : `<div class="empty" style="padding:18px"><p>Пока пусто.</p></div>`}
      </section>
    </div>
  </div>`;
}
registerView("dice", diceView);

onBind("dice", () => {
  $$("[data-ui]").forEach((inp) => {
    inp.addEventListener("input", () => {
      const key = inp.dataset.ui;
      state.ui[key] = inp.type === "number" ? Number(inp.value) : inp.value;
      if (key === "diceFaces" || key === "diceCount") return;
      save();
    });
  });
  const atk = $("#diceAttack");
  if (atk) atk.addEventListener("change", () => { state.ui.diceAttack = atk.checked; save(); });
});

reg("die-pick", (btn) => { state.ui.diceFaces = Number(btn.dataset.faces); state.ui.diceCount = 1; state.ui.diceFormula = ""; save(); render(); });
reg("dice-mode", (btn) => { state.ui.diceMode = btn.dataset.mode; save(); render(); });
reg("quick-die", (btn) => {
  const faces = Number(btn.dataset.faces);
  const res = rollFormula("1d" + faces);
  pushRoll("d" + faces, res);
  renderDiceResult(res, "d" + faces, false);
});
reg("dice-roll", () => {
  const ui = state.ui;
  const formula = (ui.diceFormula || "").trim();
  const atk = !!ui.diceAttack;
  const f = formula || (Number(ui.diceCount || 1) + "d" + (ui.diceFaces || 20) + (Number(ui.diceMod) ? (Number(ui.diceMod) > 0 ? "+" + ui.diceMod : ui.diceMod) : ""));
  const res = rollFormula(f, { mode: ui.diceMode || "normal", attack: atk });
  if (res.error) { toast(res.error, "warn"); return; }
  pushRoll((atk ? "Атака · " : "") + f, res);
  renderDiceResult(res, f, atk);
  save();
  if (state.ui.tab === "dice") render();
});
reg("rolls-clear", () => { state.rolls = []; save(); render(); toast("История бросков очищена"); });

function renderDiceResult(res, label, attack) {
  const host = $("#diceResult");
  if (!host) return;
  host.hidden = false;
  let verdict = "";
  if (attack) {
    verdict = res.miss ? `<b style="color:var(--red)">Промах</b> — на основной кости 1.`
      : res.crit ? `<b style="color:var(--amber)">Критический удар!</b> Бросьте основную кость ещё раз и добавьте; крит игнорирует броню.`
      : `<b>Попадание.</b> Обычный урон.`;
  }
  host.innerHTML = `<div class="total ${res.crit ? "crit" : res.miss ? "miss" : ""}">${res.total}</div>
    <div class="detail">${esc(label)} · ${esc(res.detail)}</div>
    ${verdict ? `<div class="verdict">${verdict}</div>` : ""}`;
}
</script>
<script>/* ================= Персонажи ================= */
function charCard(ch) {
  const max = Number(ch.maxHp) || 0, hp = Number(ch.hp) || 0;
  const cls = classByName(ch.class);
  return `<article class="card char-card">
    <div class="top">
      <div class="avatar">${esc(initials(ch.name))}</div>
      <div class="grow">
        <h3>${esc(ch.name)}</h3>
        <div class="meta">${esc(charSummary(ch))}</div>
      </div>
      <button class="icon-btn sm" type="button" data-act="open-char" data-id="${ch.id}" title="Открыть лист"><svg class="ico"><use href="#i-chevron"/></svg></button>
    </div>
    <div class="res">
      <span><b>${hp}</b> / ${max} хит</span>
      <span><b>${ch.wounds || 0}</b> / ${ch.maxWounds || 6} ран</span>
      <span><b>${armorOf(ch)}</b> броня</span>
      ${Number(ch.maxMana) ? `<span><b>${ch.mana || 0}</b> / ${ch.maxMana} мана</span>` : ""}
    </div>
    <div class="hp-bar" style="margin-top:8px"><div class="hp-fill ${hpClass(hp, max)}" style="width:${max ? Math.max(0, Math.round((hp / max) * 100)) : 0}%"></div></div>
    <div class="chips" style="margin-top:9px">
      ${(ch.conditions || []).slice(0, 4).map((c) => `<span class="tag red">${esc(c)}</span>`).join("") || `<span class="tag">без состояний</span>`}
    </div>
    ${ch.notes ? `<p class="char-note">${esc(ch.notes)}</p>` : ""}
    <div class="char-actions">
      <button class="btn btn-sm" type="button" data-act="open-char" data-id="${ch.id}"><svg class="ico"><use href="#i-user"/></svg>Лист</button>
      <button class="btn btn-sm" type="button" data-act="roll-init-char" data-id="${ch.id}"><svg class="ico"><use href="#i-d20"/></svg>Инициатива</button>
      <button class="btn btn-sm" type="button" data-act="char-to-combat" data-id="${ch.id}">В бой</button>
    </div>
  </article>`;
}

registerView("chars", () => `<div class="page-head">
  <div><p class="eyebrow">Герои</p><h1 class="page-title">Персонажи</h1>
    <p class="page-sub">Лист считает броски, броню, раны и ману. Всё можно поправить вручную — книга важнее калькулятора.</p></div>
  <div class="head-actions"><button class="btn btn-primary" type="button" data-act="new-char"><svg class="ico"><use href="#i-plus"/></svg>Создать персонажа</button></div>
</div>
${state.chars.length ? `<div class="char-grid">${state.chars.map(charCard).join("")}</div>` : `<div class="card"><div class="empty" style="padding:48px 20px">
  <svg class="ico" style="width:34px;height:34px"><use href="#i-user"/></svg>
  <p>Пока никого. Соберите героя за три шага: предок и класс, атрибуты и навыки, снаряжение.</p>
  <button class="btn btn-primary" type="button" data-act="new-char">Создать первого</button>
</div></div>`}`);

/* ---------------- Wizard ---------------- */
const ARRAYS = {
  standard: { name: "Стандартный", values: [2, 2, 0, -1] },
  balanced: { name: "Сбалансированный", values: [2, 1, 1, 0] },
  own: { name: "Свои значения", values: [0, 0, 0, 0] }
};
let wiz = null;

function newWizard() {
  return {
    step: 1, name: "", ancestry: "Человек", background: "", cls: "Охотник", level: 1,
    attrs: { STR: 2, DEX: 1, INT: 0, WIL: -2 },
    array: "balanced", skills: {}, armorKey: "", weapons: [], mana: 0, notes: ""
  };
}

function wizardOpen() {
  wiz = newWizard();
  openModal({ title: "Новый персонаж", wide: true, body: `<div id="wizRoot"></div>`, onMount: drawWizard });
}
reg("new-char", () => wizardOpen());

function wizPointsLeft() {
  const total = 4 + Math.max(0, (Number(wiz.level) || 1) - 1);
  const used = Object.values(wiz.skills).reduce((s, v) => s + Number(v || 0), 0);
  return total - used;
}

function drawWizard() {
  const root = $("#wizRoot");
  if (!root) return;
  const step = wiz.step;
  const cls = classByName(wiz.cls);
  const steps = `<div class="steps">
    <div class="step ${step === 1 ? "on" : "done"}">1. Кто вы</div>
    <div class="step ${step === 2 ? "on" : step > 2 ? "done" : ""}">2. Атрибуты</div>
    <div class="step ${step === 3 ? "on" : ""}">3. Снаряжение</div>
  </div>`;
  let body = "";
  if (step === 1) {
    body = `<div class="stack">
      <div class="field-row">
        <div class="field" style="flex:2 1 240px"><label for="wizName">Имя героя</label><input id="wizName" type="text" placeholder="Например, Ирия Совиный Клык" value="${esc(wiz.name)}"></div>
        <div class="field"><label for="wizLevel">Уровень</label><input id="wizLevel" type="number" min="1" max="20" value="${wiz.level}"></div>
      </div>
      <div class="field"><label for="wizAncestry">Предок</label>
        <select id="wizAncestry">${DATA.ancestries.map((a) => `<option value="${esc(a.name)}"${a.name === wiz.ancestry ? " selected" : ""}>${esc(a.name)} · ${esc(a.size)}</option>`).join("")}</select>
        <p class="hint">${esc((DATA.ancestries.find((a) => a.name === wiz.ancestry) || {}).trait || "")}</p>
      </div>
      <div class="field"><label for="wizBackground">Предыстория</label>
        <select id="wizBackground"><option value="">Без предыстории</option>${(DATA.backgrounds || []).map((b) => `<option value="${esc(b.name)}"${b.name === wiz.background ? " selected" : ""}>${esc(b.name)}</option>`).join("")}</select>
        <p class="hint">${esc(wiz.background ? ((DATA.backgrounds || []).find((b) => b.name === wiz.background) || {}).text || "" : "Что герой оставил позади — и почему он в пути.")}</p>
      </div>
      <div class="field"><span class="field-label">Класс</span>
        <div class="pick-grid">${DATA.classes.map((c) => `<button type="button" class="pick ${c.name === wiz.cls ? "is-active" : ""}" data-act="wiz-class" data-name="${esc(c.name)}">
          <b>${esc(c.name)}</b><span>${esc(c.role)}</span></button>`).join("")}</div>
        <p class="hint">${esc(cls.role)} · ${cls.hp} хитов на 1 уровне · кость хитов ${cls.hitDie}</p>
      </div>
    </div>`;
  } else if (step === 2) {
    body = `<div class="stack">
      <div class="field"><span class="field-label">Массив характеристик</span>
        <div class="chips">${Object.entries(ARRAYS).map(([k, a]) => `<button class="chip ${wiz.array === k ? "is-active" : ""}" type="button" data-act="wiz-array" data-key="${k}">${a.name} <span class="n">${a.values.map((v) => (v >= 0 ? "+" + v : v)).join(" ")}</span></button>`).join("")}</div>
        <p class="hint">KEY класса: ${cls.key.map((k) => STAT_SHORT[k]).join(" и ")}. Спасброски: ${savesLine(cls)}.</p>
      </div>
      <div class="attr-assign">
        ${STAT_IDS.map((id) => `<div class="attr-box"><div class="k">${STAT_SHORT[id]}</div>
          <select data-wiz-attr="${id}">${[-2, -1, 0, 1, 2, 3, 4].map((v) => `<option value="${v}"${Number(wiz.attrs[id]) === v ? " selected" : ""}>${v >= 0 ? "+" + v : v}</option>`).join("")}</select>
          <div class="small dim" style="margin-top:4px">${esc(STAT_NAME[id])}</div></div>`).join("")}
      </div>
      <div>
        <div class="sheet-h">Навыки <span class="line"></span><span class="small dim">осталось ${wizPointsLeft()}</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px">
          ${DATA.skills.map((s) => `<div class="skill-line">
            <span class="nm">${esc(s.name)}</span><span class="st">${STAT_SHORT[s.stat]}</span>
            <span class="pts">${wiz.skills[s.name] ? "+" + wiz.skills[s.name] : "—"}</span>
            <button type="button" data-act="wiz-skill" data-name="${esc(s.name)}" data-delta="-1" aria-label="Убрать пункт">−</button>
            <button type="button" data-act="wiz-skill" data-name="${esc(s.name)}" data-delta="1" aria-label="Добавить пункт">+</button>
          </div>`).join("")}
        </div>
        <p class="hint">На 1 уровне — 4 пункта навыков, по +1 за уровень. Каждый пункт даёт +1 к проверкам навыка.</p>
      </div>
      <div class="roll-result" style="margin-top:0">
        <div class="row" style="justify-content:space-between"><span class="muted small">Хиты на этом уровне</span><b class="mono" style="font-size:20px">${suggestedHp(wiz.cls, wiz.level)}</b></div>
        <p class="hint mb-0">Расчёт: ${cls.hp} на 1 уровне + среднее кости роста. Можно изменить на следующем шаге.</p>
      </div>
    </div>`;
  } else {
    const hp = wiz.hp != null ? wiz.hp : suggestedHp(wiz.cls, wiz.level);
    wiz.hp = hp;
    const armorOptions = armorOptionsFor(cls);
    body = `<div class="stack">
      <div class="field-row">
        <div class="field"><label for="wizHp">Максимум хитов</label><input id="wizHp" type="number" min="1" value="${hp}"></div>
        <div class="field"><label for="wizMana">Максимум маны</label><input id="wizMana" type="number" min="0" value="${Number(wiz.mana) || 0}"><p class="hint">Колдовские классы — по книге.</p></div>
        <div class="field"><label for="wizArmor">Броня</label>
          <select id="wizArmor">${armorOptions.map((o) => `<option value="${esc(o.key)}"${o.key === wiz.armorKey ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select>
        </div>
      </div>
      <div class="field"><span class="field-label">Оружие</span>
        <div class="pick-grid">
          ${defaultWeaponChoices(cls).map((w) => `<button type="button" class="pick ${wiz.weapons.includes(w.name) ? "is-active" : ""}" data-act="wiz-weapon" data-name="${esc(w.name)}">
            <b>${esc(w.name)}</b><span>${esc(w.dice)}+${w.stat} ${esc(w.type)}</span></button>`).join("")}
        </div>
        <p class="hint">Стартовый набор класса: ${esc((cls.gear || []).join(", "))}</p>
      </div>
      <div class="field"><label for="wizNotes">Заметки</label><textarea id="wizNotes" rows="3" placeholder="Клятва, долг, странность, тайна…">${esc(wiz.notes)}</textarea></div>
      <div class="roll-result" style="margin-top:0">
        <div class="kv" style="display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:13px">
          <span class="dim">Имя</span><span>${esc(wiz.name || "—")}</span>
          <span class="dim">Кто</span><span>${esc(wiz.ancestry)} · ${esc(wiz.cls)} · ур. ${wiz.level}${wiz.background ? " · " + esc(wiz.background) : ""}</span>
          <span class="dim">Атрибуты</span><span class="mono">${STAT_IDS.map((k) => STAT_SHORT[k] + " " + (wiz.attrs[k] >= 0 ? "+" : "") + wiz.attrs[k]).join(" · ")}</span>
          <span class="dim">Хиты / броня</span><span>${hp} хитов · ${armorLabelByKey(wiz.armorKey) || "без брони"}</span>
          <span class="dim">Навыки</span><span>${Object.entries(wiz.skills).filter(([, v]) => v).map(([k, v]) => k + " +" + v).join(", ") || "—"}</span>
        </div>
      </div>
    </div>`;
  }

  const foot = `<button class="btn btn-ghost" type="button" data-act="wiz-cancel">Отмена</button><span class="spacer"></span>
    ${step > 1 ? `<button class="btn" type="button" data-act="wiz-back">Назад</button>` : ""}
    ${step < 3 ? `<button class="btn btn-primary" type="button" data-act="wiz-next">Дальше</button>` : `<button class="btn btn-primary" type="button" data-act="wiz-finish">Создать героя</button>`}`;
  root.innerHTML = steps + body;
  const footHost = $(".modal-foot");
  if (footHost) footHost.innerHTML = foot;
  else {
    const modal = $(".modal");
    if (modal) modal.insertAdjacentHTML("beforeend", `<footer class="modal-foot">${foot}</footer>`);
  }
  $$("[data-wiz-attr]").forEach((sel) => sel.addEventListener("change", () => { wiz.attrs[sel.dataset.wizAttr] = Number(sel.value); }));
}

function savesLine(cls) {
  const label = { 1: "преим.", 0: "норма", "-1": "помеха" };
  return STAT_IDS.map((k) => STAT_SHORT[k] + " " + (label[cls.saves[k]] || "норма")).join(", ");
}
function armorOptionsFor(cls) {
  const allowed = (cls.armor || []).filter((a) => a !== "—");
  const opts = [{ key: "", label: "Без брони" }];
  DATA.armor.forEach((a) => {
    if (allowed.length && allowed.includes(a.cat)) opts.push({ key: a.name, label: `${a.name} · ${a.armor} · ${a.cost}` });
  });
  if (!allowed.length) {
    DATA.armor.filter((a) => a.cat === "Ткань" || a.cat === "Кожа").forEach((a) => opts.push({ key: a.name, label: `${a.name} · ${a.armor} · ${a.cost}` }));
  }
  opts.push({ key: "custom", label: "Вручную (задам число)" });
  return opts;
}
function armorLabelByKey(key) {
  if (!key) return "";
  if (key === "custom") return "вручную";
  const a = DATA.armor.find((x) => x.name === key);
  return a ? a.armor : "";
}
function defaultWeaponChoices(cls) {
  const types = cls.weapons || "";
  const names = [];
  const has = (n) => DATA.weapons.find((w) => w.name.toLowerCase().includes(n));
  if (/СИЛ/i.test(types)) { ["Боевой топор", "Длинный меч", "Копьё", "Дубина", "Дротики"].forEach((n) => { const w = DATA.weapons.find((x) => x.name.startsWith(n)); if (w) names.push(w); }); }
  if (/ЛВК/i.test(types)) { ["Кинжал", "Короткий меч", "Рапира", "Короткий лук", "Праща"].forEach((n) => { const w = DATA.weapons.find((x) => x.name.startsWith(n)); if (w) names.push(w); }); }
  if (/клинк|посох|жезл/i.test(types)) { ["Кинжал", "Посох", "Короткий меч"].forEach((n) => { const w = DATA.weapons.find((x) => x.name.startsWith(n)); if (w) names.push(w); }); }
  if (/ближн/i.test(types)) { ["Посох", "Кинжал"].forEach((n) => { const w = DATA.weapons.find((x) => x.name.startsWith(n)); if (w) names.push(w); }); }
  if (!names.length) DATA.weapons.slice(0, 6).forEach((w) => names.push(w));
  return names.filter((w, i, arr) => arr.findIndex((x) => x.name === w.name) === i).slice(0, 8);
}

reg("wiz-class", (btn) => { wiz.cls = btn.dataset.name; wiz.hp = null; drawWizard(); });
reg("wiz-array", (btn) => {
  wiz.array = btn.dataset.key;
  const vals = ARRAYS[wiz.array].values;
  STAT_IDS.forEach((id, i) => { wiz.attrs[id] = vals[i] != null ? vals[i] : 0; });
  drawWizard();
});
reg("wiz-skill", (btn) => {
  const name = btn.dataset.name, delta = Number(btn.dataset.delta);
  const cur = Number(wiz.skills[name] || 0);
  const next = cur + delta;
  if (next < 0) return;
  if (delta > 0 && wizPointsLeft() <= 0) { toast("Пункты навыков закончились", "warn"); return; }
  if (next > 3) return;
  wiz.skills[name] = next;
  if (!next) delete wiz.skills[name];
  drawWizard();
});
reg("wiz-weapon", (btn) => {
  const name = btn.dataset.name;
  const i = wiz.weapons.indexOf(name);
  if (i >= 0) wiz.weapons.splice(i, 1); else wiz.weapons.push(name);
  drawWizard();
});
reg("wiz-cancel", () => { closeModal(); wiz = null; });
reg("wiz-back", () => { collectWizard(); wiz.step = Math.max(1, wiz.step - 1); drawWizard(); });
reg("wiz-next", () => {
  collectWizard();
  if (wiz.step === 1 && !wiz.name.trim()) { wiz.name = "Безымянный герой"; }
  wiz.step = Math.min(3, wiz.step + 1);
  drawWizard();
});

function collectWizard() {
  if (!wiz) return;
  const name = $("#wizName"); if (name) wiz.name = name.value.trim();
  const lvl = $("#wizLevel"); if (lvl) wiz.level = clamp(Number(lvl.value) || 1, 1, 20);
  const anc = $("#wizAncestry"); if (anc) wiz.ancestry = anc.value;
  const bg = $("#wizBackground"); if (bg) wiz.background = bg.value;
  const hp = $("#wizHp"); if (hp) wiz.hp = Math.max(1, Number(hp.value) || 1);
  const mana = $("#wizMana"); if (mana) wiz.mana = Math.max(0, Number(mana.value) || 0);
  const armor = $("#wizArmor"); if (armor) wiz.armorKey = armor.value;
  const notes = $("#wizNotes"); if (notes) wiz.notes = notes.value;
}
reg("wiz-finish", () => {
  collectWizard();
  const cls = classByName(wiz.cls);
  const armor = wiz.armorKey && wiz.armorKey !== "custom" ? DATA.armor.find((a) => a.name === wiz.armorKey) : null;
  const ch = {
    id: uid(), name: wiz.name.trim() || "Безымянный герой",
    ancestry: wiz.ancestry, background: wiz.background || "", class: wiz.cls, level: clamp(Number(wiz.level) || 1, 1, 20),
    str: Number(wiz.attrs.STR) || 0, dex: Number(wiz.attrs.DEX) || 0, int: Number(wiz.attrs.INT) || 0, wil: Number(wiz.attrs.WIL) || 0,
    skills: { ...wiz.skills },
    hp: Number(wiz.hp) || suggestedHp(wiz.cls, wiz.level),
    maxHp: Number(wiz.hp) || suggestedHp(wiz.cls, wiz.level),
    wounds: 0, maxWounds: 6,
    mana: Number(wiz.mana) || 0, maxMana: Number(wiz.mana) || 0,
    armorFormula: armor ? armor.armor : "", armorLabel: armor ? armor.name : "Без брони",
    speed: 6,
    weapons: wiz.weapons.map((n) => { const w = DATA.weapons.find((x) => x.name === n); return w ? { name: w.name, dice: w.dice, stat: w.stat, type: w.type, props: w.props } : null; }).filter(Boolean),
    conditions: [], notes: wiz.notes || "",
    created: Date.now(), updated: Date.now()
  };
  state.chars.push(ch);
  state.ui.charId = ch.id;
  save();
  closeModal();
  wiz = null;
  render();
  toast("Герой создан: " + esc(ch.name));
  openCharSheet(ch.id);
});

/* ---------------- Character sheet ---------------- */
function drawSheet() {
  const ch = charById(state.ui.charId);
  const root = $("#sheetRoot");
  if (!ch || !root) { closeModal(); return; }
  const scroller = root.parentElement;
  const top = scroller ? scroller.scrollTop : 0;
  root.innerHTML = sheetHTML(ch);
  if (scroller) scroller.scrollTop = top;
}

function sheetHTML(ch) {
  const cls = classByName(ch.class);
  const max = Number(ch.maxHp) || 0, hp = clamp(Number(ch.hp) || 0, 0, max);
  const armor = armorOf(ch);
  const statBtn = (id) => `<button class="stat" type="button" data-act="sheet-check" data-stat="${id}">
      <div class="k">${STAT_SHORT[id]}</div><div class="v">${ch[id.toLowerCase()] >= 0 ? "+" : ""}${ch[id.toLowerCase()] || 0}</div><div class="roll">проверка</div></button>`;
  const saveAdv = (id) => (cls?.saves?.[id] === 1 ? "преим." : cls?.saves?.[id] === -1 ? "помеха" : "");
  const woundPips = Array.from({ length: Math.max(6, Number(ch.maxWounds) || 6) }, (_, i) => `<button class="pip wound ${i < (ch.wounds || 0) ? "on" : ""}" type="button" data-act="sheet-wound" data-n="${i + 1}" aria-label="Рана ${i + 1}"></button>`).join("");
  const manaPips = Number(ch.maxMana) ? `<div class="track" style="margin-top:6px"><span class="small dim" style="width:56px">Мана</span><div class="box">${Array.from({ length: Number(ch.maxMana) }, (_, i) => `<button class="pip mana ${i < (ch.mana || 0) ? "on" : ""}" type="button" data-act="sheet-mana" data-n="${i + 1}" aria-label="Мана ${i + 1}"></button>`).join("")}</div></div>` : "";
  return `<div class="stack">
    <div class="field-row" style="align-items:flex-end">
      <div class="field grow"><label for="sheetName">Имя</label><input id="sheetName" type="text" value="${esc(ch.name)}" data-char="name"></div>
      <div class="field" style="flex:0 1 90px"><label for="sheetLevel">Уровень</label><input id="sheetLevel" type="number" min="1" max="20" value="${ch.level || 1}" data-char="level"></div>
      <div class="field" style="flex:0 1 130px"><label for="sheetClass">Класс</label><select id="sheetClass" data-char="class">${DATA.classes.map((c) => `<option${c.name === ch.class ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
      <div class="field" style="flex:1 1 150px"><label for="sheetBackground">Предыстория</label>
        <select id="sheetBackground" data-char="background"><option value="">Без предыстории</option>${(DATA.backgrounds || []).map((b) => `<option${b.name === ch.background ? " selected" : ""}>${esc(b.name)}</option>`).join("")}</select>
      </div>
    </div>
    <div class="sheet-grid">
      <div>
        <div class="sheet-block">
          <div class="sheet-h">Атрибуты <span class="line"></span><span class="small dim">нажмите для броска</span></div>
          <div class="stat-grid">${STAT_IDS.map(statBtn).join("")}</div>
          <div class="row small dim" style="justify-content:space-between;margin-top:5px">
            ${STAT_IDS.map((id) => `<span>${STAT_SHORT[id]}: спас ${saveAdv(id) || "норма"}</span>`).join("")}
          </div>
        </div>

        <div class="sheet-block">
          <div class="sheet-h">Навыки <span class="line"></span><span class="small dim">пункты: ${Object.values(ch.skills || {}).reduce((s, v) => s + Number(v || 0), 0)}</span></div>
          ${DATA.skills.map((s) => `<div class="skill-line">
            <button class="nm" style="background:none;border:0;color:inherit;text-align:left;padding:0" type="button" data-act="sheet-skill" data-name="${esc(s.name)}">${esc(s.name)}</button>
            <span class="st">${STAT_SHORT[s.stat]}</span>
            <span class="pts">${skillTotal(ch, s) >= 0 ? "+" : ""}${skillTotal(ch, s)}</span>
            <button type="button" data-act="sheet-skillpt" data-name="${esc(s.name)}" data-delta="-1" aria-label="Минус пункт">−</button>
            <button type="button" data-act="sheet-skillpt" data-name="${esc(s.name)}" data-delta="1" aria-label="Плюс пункт">+</button>
          </div>`).join("")}
        </div>

        <div class="sheet-block">
          <div class="sheet-h">Оружие <span class="line"></span><button class="btn btn-sm" type="button" data-act="sheet-add-weapon">＋</button></div>
          ${(ch.weapons || []).length ? ch.weapons.map((w, i) => `<div class="weapon-line">
            <span class="nm">${esc(w.name)}</span>
            <span class="dmg">${esc(w.dice)}+${w.stat}</span>
            <button class="btn btn-sm" type="button" data-act="sheet-attack" data-i="${i}">Атака</button>
            <button class="icon-btn sm danger" type="button" data-act="sheet-del-weapon" data-i="${i}" aria-label="Удалить"><svg class="ico"><use href="#i-close"/></svg></button>
          </div>`).join("") : `<p class="hint">Добавьте оружие, чтобы бросать атаку одной кнопкой.</p>`}
        </div>

        ${cls ? `<div class="sheet-block">
          <div class="sheet-h">Способности класса <span class="line"></span><span class="small dim">${esc(cls.hitDie)} · ${cls.hp} хитов</span></div>
          ${(cls.lvl1 || []).map((a) => `<div class="action"><b>${esc(a.n)}.</b> <span class="d">${esc(a.d)}</span></div>`).join("")}
        </div>` : ""}
      </div>

      <div>
        <div class="sheet-block">
          <div class="sheet-h">Жизнь <span class="line"></span></div>
          <div class="row" style="justify-content:space-between;align-items:flex-end">
            <div><div class="hp-big">${hp}<small> / ${max}</small></div><div class="small dim">хиты</div></div>
            <div class="row">
              <button class="btn btn-sm" type="button" data-act="sheet-hp" data-delta="-5">−5</button>
              <button class="btn btn-sm" type="button" data-act="sheet-hp" data-delta="-1">−1</button>
              <button class="btn btn-sm" type="button" data-act="sheet-hp" data-delta="1">+1</button>
              <button class="btn btn-sm" type="button" data-act="sheet-hp" data-delta="5">+5</button>
            </div>
          </div>
          <div class="hp-bar" style="height:8px;margin-top:8px"><div class="hp-fill ${hpClass(hp, max)}" style="width:${max ? Math.round((hp / max) * 100) : 0}%"></div></div>
          <div class="field-row" style="margin-top:10px">
            <div class="field"><label for="sheetHp">Текущие хиты</label><input id="sheetHp" type="number" min="0" max="${max}" value="${hp}" data-char="hp"></div>
            <div class="field"><label for="sheetMaxHp">Максимум</label><input id="sheetMaxHp" type="number" min="1" value="${max}" data-char="maxHp"></div>
            <div class="field"><label for="sheetArmor">Броня</label><input id="sheetArmor" type="number" min="0" value="${armor}" data-char="armorValue"><p class="hint">${esc(ch.armorLabel || "")}${ch.armorFormula ? " · " + esc(ch.armorFormula) : ""}</p></div>
          </div>
        </div>

        <div class="sheet-block">
          <div class="sheet-h">Раны <span class="line"></span><span class="small dim">6 — смерть</span></div>
          <div class="track"><div class="box">${woundPips}</div><span class="mono small">${ch.wounds || 0}</span></div>
          ${manaPips}
          <div class="row" style="margin-top:10px">
            <button class="btn btn-sm" type="button" data-act="sheet-rest" title="Безопасный отдых: полное восстановление, −1 рана">Безопасный отдых</button>
            <span class="small dim">${esc(DATA.restNote)}</span>
          </div>
        </div>

        <div class="sheet-block">
          <div class="sheet-h">Состояния <span class="line"></span></div>
          <div class="chips">
            ${(ch.conditions || []).map((c) => `<button class="chip" type="button" data-act="sheet-cond-remove" data-name="${esc(c)}">${esc(c)} ×</button>`).join("") || `<span class="small dim">нет</span>`}
          </div>
          <select class="mt-8" data-act="sheet-cond-add"><option value="">Добавить состояние…</option>${DATA.conditions.map((c) => `<option>${esc(c.name)}</option>`).join("")}</select>
        </div>

        <div class="sheet-block">
          <div class="sheet-h">Заметки <span class="line"></span></div>
          <textarea id="sheetNotes" rows="4" data-char="notes" placeholder="Мотивы, долги, секреты…">${esc(ch.notes || "")}</textarea>
        </div>

        <div id="sheetRollResult" class="roll-result" hidden></div>

        <div class="row" style="margin-top:12px">
          <button class="btn btn-sm" type="button" data-act="sheet-levelup">＋ Уровень</button>
          <button class="btn btn-sm" type="button" data-act="char-to-combat" data-id="${ch.id}">В бой</button>
          <button class="btn btn-sm btn-danger" type="button" data-act="char-delete" data-id="${ch.id}" style="margin-left:auto">Удалить</button>
        </div>
      </div>
    </div>
  </div>`;
}

function openCharSheet(id) {
  state.ui.charId = id;
  save();
  openModal({
    title: "Лист персонажа", wide: true,
    body: `<div id="sheetRoot"></div>`,
    onMount: () => {
      drawSheet();
      const root = $("#sheetRoot");
      root.addEventListener("input", (e) => {
        const t = e.target.closest("[data-char]");
        if (!t) return;
        const ch = charById(state.ui.charId);
        if (!ch) return;
        const key = t.dataset.char;
        let v = t.type === "number" ? Number(t.value) : t.value;
        if (key === "hp") v = clamp(Number(v) || 0, 0, Number(ch.maxHp) || 0);
        ch[key] = v;
        ch.updated = Date.now();
        save();
        if (key === "maxHp" || key === "level") {
          if (key === "level") ch.level = clamp(Number(ch.level) || 1, 1, 20);
          drawSheet();
        }
      });
      root.addEventListener("change", (e) => {
        const t = e.target.closest("[data-act='sheet-cond-add']");
        if (!t) return;
        const ch = charById(state.ui.charId);
        if (!ch || !t.value) return;
        ch.conditions = ch.conditions || [];
        if (!ch.conditions.includes(t.value)) ch.conditions.push(t.value);
        save(); drawSheet(); render();
      });
    }
  });
}
reg("open-char", (btn) => openCharSheet(btn.dataset.id));

reg("sheet-check", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const id = btn.dataset.stat;
  const mod = Number(ch[id.toLowerCase()]) || 0;
  const res = rollFormula("1d20" + (mod >= 0 ? "+" + mod : mod));
  pushRoll(ch.name + " · " + STAT_NAME[id], res);
  showSheetRoll(res, `${STAT_NAME[id]} ${mod >= 0 ? "+" + mod : mod}`);
});
reg("sheet-skill", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const s = DATA.skills.find((x) => x.name === btn.dataset.name);
  if (!s) return;
  const total = skillTotal(ch, s);
  const res = rollFormula("1d20" + (total >= 0 ? "+" + total : total));
  pushRoll(ch.name + " · " + s.name, res);
  showSheetRoll(res, `${s.name} ${total >= 0 ? "+" + total : total}`);
});
reg("sheet-skillpt", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const name = btn.dataset.name, d = Number(btn.dataset.delta);
  ch.skills = ch.skills || {};
  const cur = Number(ch.skills[name] || 0);
  const next = cur + d;
  if (next < 0 || next > 6) return;
  if (next) ch.skills[name] = next; else delete ch.skills[name];
  save(); drawSheet();
});
reg("sheet-hp", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  ch.hp = clamp((Number(ch.hp) || 0) + Number(btn.dataset.delta), 0, Number(ch.maxHp) || 0);
  if (ch.hp === 0 && !(ch.conditions || []).includes("При смерти")) { ch.conditions = [...(ch.conditions || []), "При смерти"]; ch.wounds = Math.min((ch.wounds || 0) + 1, ch.maxWounds || 6); }
  save(); drawSheet(); render();
});
reg("sheet-wound", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const n = Number(btn.dataset.n);
  ch.wounds = ch.wounds === n ? n - 1 : n;
  save(); drawSheet();
});
reg("sheet-mana", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const n = Number(btn.dataset.n);
  ch.mana = ch.mana === n ? n - 1 : n;
  save(); drawSheet();
});
reg("sheet-cond-remove", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  ch.conditions = (ch.conditions || []).filter((c) => c !== btn.dataset.name);
  save(); drawSheet(); render();
});
reg("sheet-rest", () => {
  const ch = charById(state.ui.charId); if (!ch) return;
  ch.hp = Number(ch.maxHp) || 0;
  ch.mana = Number(ch.maxMana) || 0;
  ch.wounds = Math.max(0, (Number(ch.wounds) || 0) - 1);
  ch.conditions = (ch.conditions || []).filter((c) => c !== "При смерти");
  save(); drawSheet(); render();
  toast("Безопасный отдых: хиты и мана восстановлены, −1 рана");
});
reg("sheet-levelup", () => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const die = hitDieMax(ch);
  ch.level = clamp((Number(ch.level) || 1) + 1, 1, 20);
  ch.maxHp = (Number(ch.maxHp) || 0) + Math.floor(die / 2) + 1;
  ch.hp = Math.min(Number(ch.hp) + Math.floor(die / 2) + 1, ch.maxHp);
  save(); drawSheet(); render();
  toast("Уровень " + ch.level + ": +" + (Math.floor(die / 2) + 1) + " к максимуму хитов");
});
reg("sheet-add-weapon", () => {
  const ch = charById(state.ui.charId); if (!ch) return;
  openWeaponPicker((w) => {
    ch.weapons = ch.weapons || [];
    ch.weapons.push({ name: w.name, dice: w.dice, stat: w.stat, type: w.type, props: w.props });
    save(); drawSheet(); toast("Добавлено: " + w.name);
  });
});
function openWeaponPicker(cb) {
  openModal({ title: "Добавить оружие", body: `<div class="pick-grid">${DATA.weapons.map((w) => `<button class="pick" type="button" data-act="pick-weapon" data-name="${esc(w.name)}"><b>${esc(w.name)}</b><span>${esc(w.dice)}+${w.stat} ${esc(w.type)} · ${esc(w.cost)}</span></button>`).join("")}</div>`, onMount: () => { window.__weaponCb = cb; } });
}
reg("pick-weapon", (btn) => {
  const w = DATA.weapons.find((x) => x.name === btn.dataset.name);
  closeModal();
  if (w && window.__weaponCb) { window.__weaponCb(w); window.__weaponCb = null; }
});
reg("sheet-del-weapon", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  ch.weapons.splice(Number(btn.dataset.i), 1);
  save(); drawSheet();
});
reg("sheet-attack", (btn) => {
  const ch = charById(state.ui.charId); if (!ch) return;
  const w = ch.weapons[Number(btn.dataset.i)]; if (!w) return;
  const mod = Number(ch[w.stat.toLowerCase()]) || 0;
  const res = rollFormula(w.dice + (mod >= 0 ? "+" + mod : mod), { attack: true });
  pushRoll(ch.name + " · " + w.name, res);
  showSheetRoll(res, w.name + " · " + w.dice + (mod >= 0 ? "+" + mod : mod), true);
});
function showSheetRoll(res, label, attack) {
  const host = $("#sheetRollResult");
  if (!host) return;
  host.hidden = false;
  let verdict = "";
  if (attack) verdict = res.miss ? `<b style="color:var(--red)">Промах</b>` : res.crit ? `<b style="color:var(--amber)">Крит!</b> Бросьте основную кость ещё раз; броня игнорируется.` : `<b>Попадание</b>`;
  host.innerHTML = `<div class="total ${res.crit ? "crit" : res.miss ? "miss" : ""}">${res.total}</div>
    <div class="detail">${esc(label)} · ${esc(res.detail)}</div>${verdict ? `<div class="verdict">${verdict}</div>` : ""}`;
}
reg("char-delete", (btn) => {
  const ch = charById(btn.dataset.id); if (!ch) return;
  if (!confirm(`Удалить персонажа «${ch.name}»? Это необратимо.`)) return;
  state.chars = state.chars.filter((c) => c.id !== ch.id);
  if (state.ui.charId === ch.id) state.ui.charId = state.chars[0]?.id || null;
  save(); closeModal(); render(); toast("Персонаж удалён");
});
reg("char-to-combat", (btn) => {
  const ch = charById(btn.dataset.id || state.ui.charId); if (!ch) return;
  addCharToCombat(ch);
  closeModal();
  go("combat");
});
reg("roll-init-char", (btn) => {
  const ch = charById(btn.dataset.id); if (!ch) return;
  const res = rollFormula("1d20+" + (Number(ch.dex) || 0));
  pushRoll(ch.name + " · инициатива", res);
  toast(`<b>${esc(ch.name)}</b>: инициатива ${res.total}`);
  const existing = state.combat.combatants.find((c) => c.charId === ch.id);
  if (existing) { existing.init = res.total; sortCombatants(); save(); render(); }
  else addCharToCombat(ch, res.total);
});
</script>
<script>/* ================= Справочник, записи и командная палитра ================= */
function refKey(e) { return e.type + ":" + e.name; }
function findRef(type, name) { return refIndex().find((e) => e.type === type && e.name === name); }
function refCounts() {
  const c = {};
  refIndex().forEach((e) => { c[e.type] = (c[e.type] || 0) + 1; });
  return c;
}

const REF_TYPES = [
  ["all", "Всё"], ["rule", "Правила"], ["condition", "Состояния"], ["weapon", "Оружие"],
  ["armor", "Броня"], ["gear", "Снаряжение"], ["magic", "Магические предметы"], ["monster", "Существа"],
  ["spell", "Заклинания"], ["class", "Классы"], ["ancestry", "Предки"], ["background", "Предыстории"], ["custom", "Своё"]
];

function refView() {
  const type = state.ui.refType || "all";
  const q = state.ui.refQuery || "";
  const results = searchRefs(q, type);
  const counts = refCounts();
  if (!state.ui.refSel && results.length) state.ui.refSel = refKey(results[0]);
  let sel = results.find((e) => refKey(e) === state.ui.refSel) || results[0];
  if (sel) state.ui.refSel = refKey(sel);
  const entry = sel ? entryHTML(sel) : `<div class="card"><div class="empty"><p>Ничего не найдено. Попробуйте другое слово или добавьте свою запись.</p></div></div>`;
  return `<div class="page-head">
    <div><p class="eyebrow">Справочник</p><h1 class="page-title">Всё за столом</h1>
      <p class="page-sub">${refIndex().length} записей: правила, состояния, оружие, магические предметы, бестиарий и заклинания. Поиск ищет и по тексту.</p></div>
    <div class="head-actions"><button class="btn" type="button" data-act="custom-new"><svg class="ico"><use href="#i-plus"/></svg>Своя запись</button></div>
  </div>
  <div class="searchbar" style="margin-bottom:12px">
    <svg class="ico"><use href="#i-search"/></svg>
    <input id="refSearch" type="search" aria-label="Поиск по справочнику" placeholder="Найти: «огонь», «схвачен», «тролль», «отдых»…" value="${esc(q)}" autocomplete="off">
    ${q ? `<button class="icon-btn sm clear" type="button" data-act="ref-clear" aria-label="Очистить">×</button>` : ""}
  </div>
  <div class="chips" style="margin-bottom:14px">
    ${REF_TYPES.map(([k, label]) => `<button class="chip ${type === k ? "is-active" : ""}" type="button" data-act="ref-type" data-type="${k}">${label}${k !== "all" && counts[k] ? ` <span class="n">${counts[k]}</span>` : ""}</button>`).join("")}
  </div>
  <div class="ref-layout">
    <div class="card ref-list">
      ${results.length ? results.map((e) => `<button class="ref-row ${sel && refKey(e) === refKey(sel) ? "is-active" : ""}" type="button" data-act="ref-select" data-key="${esc(refKey(e))}">
        <div><div class="nm">${esc(e.name)}</div>${e.sub ? `<div class="sub">${esc(e.sub)}</div>` : ""}</div>
        <span class="ty">${TYPE_LABEL[e.type] || ""}</span>
      </button>`).join("") : `<div class="empty" style="padding:20px"><p>Пусто.</p></div>`}
    </div>

/* ---------------- Entry rendering ---------------- */
function entryHTML(e) {
  const r = e.raw || {};
  const tag = (t, cls = "") => `<span class="tag ${cls}">${esc(t)}</span>`;

  let body = "";

  if (e.type === "rule") {
    body = `<p class="lede">${esc(r.cat || "")}</p><p>${esc(r.text || e.text).replace(/\n/g, "<br>")}</p>`;
  } else if (e.type === "condition") {
    body = `<p>${esc(r.desc || e.text).replace(/\n/g, "<br>")}</p>`;
  } else if (e.type === "weapon") {
    body = weaponBodyHTML(r);
  } else if (e.type === "armor") {
    body = `<div class="statline">${tag(r.cat)}${tag("Броня " + r.armor, "blue")}${tag(r.cost)}</div>

  } else if (e.type === "gear") {
    body = `<div class="statline">${tag(r.cost)}</div><p>${esc(r.desc)}</p>`;
  } else if (e.type === "magic") {
    body = `<div class="statline">${tag(r.rarity || "магический предмет", "violet")}</div><p>${esc(r.desc).replace(/\n/g, "<br>")}</p>`;
  } else if (e.type === "monster") {
    body = monsterBodyHTML(r);
  } else if (e.type === "spell") {
    const dmg = (r.text.match(/(\d*d\d+|\d+)/i) || [])[0];
    body = `<div class="statline">${tag(r.school, "violet")}${tag(r.tier ? "Тир " + r.tier : "Кантрип", "amber")}${tag(r.cast)}${r.target ? tag(r.target) : ""}</div>
      <p>${esc(r.text).replace(/\n/g, "<br>")}</p>
      <div class="row mt-12">
        <button class="btn btn-sm" type="button" data-act="ref-roll" data-formula="d20" data-label="${esc(r.name)}">d20</button>
        ${/\d*d\d+/.test(r.text) ? `<button class="btn btn-sm" type="button" data-act="ref-roll" data-formula="${esc((r.text.match(/\d*d\d+(?:\+\d+)?/) || [""])[0] || "1d6")}" data-label="${esc(r.name)}">Бросок урона</button>` : ""}
        <button class="btn btn-sm" type="button" data-act="ref-copy" data-text="${esc(r.name + ". " + r.text)}">Копировать</button>
        <button class="btn btn-sm" type="button" data-act="ref-card" data-type="spell" data-name="${esc(r.name)}">Карточка</button>
      </div>`;
  } else if (e.type === "class") {
    body = `<div class="statline">${tag(r.hp + " хитов", "green")}${tag("Кость " + r.hitDie)}${tag("KEY: " + r.key.map((k) => STAT_SHORT[k]).join("/"), "amber")}${tag(r.armor.join(", ") || "без брони")}</div>
      <p class="lede">${esc(r.role)}</p>
      <dl class="kv"><dt>Спасброски</dt><dd>${savesLine(r)}</dd><dt>Оружие</dt><dd>${esc(r.weapons)}</dd><dt>Старт</dt><dd>${(r.gear || []).map(esc).join(", ")}</dd></dl>
      <h3>1 уровень</h3>
      ${(r.lvl1 || []).map((a) => `<div class="action"><b>${esc(a.n)}.</b> <span class="d">${esc(a.d)}</span></div>`).join("")}`;
  } else if (e.type === "ancestry") {
    body = `<div class="statline">${tag(r.size)}</div><p>${esc(r.trait).replace(/\n/g, "<br>")}</p>`;
  } else if (e.type === "background") {
    body = `<div class="statline">${tag("Предыстория", "violet")}</div><p>${esc(r.text).replace(/\n/g, "<br>")}</p>`;
  } else if (e.type === "custom") {

      <button class="btn btn-sm btn-danger" type="button" data-act="custom-delete" data-id="${esc(r.id)}">Удалить</button></div>`;
    }
  }
  return head + "</div>" + body;
}
