let customKind = "text";
reg("custom-kind", (btn) => {
  customKind = btn.dataset.kind;
  $$("[data-act='custom-kind']").forEach((b) => b.classList.toggle("is-active", b.dataset.kind === customKind));
  $$("[data-cufield]").forEach((el) => {
    const show = customKind === "monster" ? el.dataset.cufield === "monster-fields" || el.dataset.cufield === "text"
      : customKind === "weapon" ? el.dataset.cufield === "weapon-fields"
      : el.dataset.cufield === "sub" || el.dataset.cufield === "text";
    el.style.display = show ? "" : "none";
  });
  const lbl = $("[data-cufield='text'] label");
  if (lbl) lbl.textContent = customKind === "monster" ? "Описание и действия" : "Текст";
  const text = $("#cuText");
  if (text) text.placeholder = customKind === "monster" ? "Каждое действие с новой строки: Название: описание (например, 1к6+2)" : "Что нужно помнить за столом";
  const saveBtn = $("[data-act='custom-save']");
  if (saveBtn) saveBtn.dataset.kind = customKind;
});
reg("custom-save", (btn) => {
  const name = $("#cuName")?.value.trim();
  const kind = btn.dataset.kind || "text";
  if (!name) { toast("Нужно название", "warn"); return; }
  const sub = $("#cuSub")?.value.trim();
  const text = $("#cuText")?.value.trim();
  const id = btn.dataset.id;
  const rec = { name, kind, sub, text };
  if (kind === "monster") {
    rec.lvl = $("#cuLvl")?.value.trim() || "1";
    rec.hp = Math.max(1, Number($("#cuHp")?.value) || 1);
    rec.speed = Math.max(0, Number($("#cuSpeed")?.value) || 6);
    rec.size = $("#cuSize")?.value || "Средний";
    rec.armor = $("#cuArmor")?.value || "none";
    rec.group = $("#cuKind")?.value.trim() || "";
  } else if (kind === "weapon") {
    rec.dice = $("#cuDice")?.value.trim() || "1d6";
    rec.stat = $("#cuStat")?.value || "";
    rec.wtype = $("#cuWtype")?.value.trim() || "";
    rec.cost = $("#cuCost")?.value.trim() || "";
    rec.props = ($("#cuProps")?.value || "").split(",").map((x) => x.trim()).filter(Boolean);
  }
  if (id) {
    const item = state.custom.find((c) => c.id === id);
    if (item) Object.keys(rec).forEach((k) => { item[k] = rec[k]; });
  } else {
    state.custom.push({ id: uid(), ...rec });
  }
  rebuildRefIndex(); save(); closeModal();
  state.ui.refType = kind === "monster" ? "monster" : kind === "weapon" ? "weapon" : "custom";
  state.ui.refSel = (kind === "monster" ? "monster:" : kind === "weapon" ? "weapon:" : "custom:") + name;
  render();
  toast("Запись сохранена");
});
reg("custom-delete", (btn) => {
  if (!confirm("Удалить эту запись?")) return;
  state.custom = state.custom.filter((c) => c.id !== btn.dataset.id);
  rebuildRefIndex(); save(); state.ui.refSel = null; closeDrawer(); render();
});

/* ---------------- Command palette ---------------- */
let paletteIdx = 0;
let paletteItems = [];

function paletteOpen() {
  const p = $("#palette");
  if (!p) return;
  p.hidden = false;
  document.body.style.overflow = "hidden";
  const inp = $("#paletteInput");
  inp.value = "";
  paletteIdx = 0;
  renderPalette("");
  setTimeout(() => inp.focus(), 30);
}
function paletteClose() {
  const p = $("#palette");
  if (!p) return;
  p.hidden = true;
  document.body.style.overflow = $("#modalRoot").hidden && $("#drawer").hidden ? "" : "hidden";
}
function openPalette() { paletteOpen(); }
reg("open-palette", () => paletteOpen());

function renderPalette(q) {
  const query = q.trim();
  const host = $("#paletteResults");
  if (!host) return;
  paletteItems = [];
  const low = norm(query);
  const mark = (text) => {
    if (!query) return esc(text);
    const i = norm(text).indexOf(low);
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + query.length)) + "</mark>" + esc(text.slice(i + query.length));
  };
  const add = (item) => { if (!query || norm(item.name + " " + (item.sub || "")).includes(low)) paletteItems.push(item); };

  ["Ширма", "Персонажи", "Кубики", "Справочник", "Бой", "Напоминания", "Заметки"].forEach((name) => {
    const tab = { "Ширма": "screen", "Персонажи": "chars", "Кубики": "dice", "Справочник": "ref", "Бой": "combat", "Напоминания": "reminders", "Заметки": "notes" }[name];
    add({ kind: "tab", name, sub: "раздел", tab });
  });
  state.chars.forEach((c) => add({ kind: "char", name: c.name, sub: charSummary(c), id: c.id }));
  state.notes.forEach((n) => add({ kind: "note", name: n.title || "Без названия", sub: "заметка · " + timeAgo(n.updated || n.created || Date.now()), id: n.id }));
  searchRefs(query, "all").slice(0, 40).forEach((e) => add({ kind: "ref", name: e.name, sub: e.sub || TYPE_LABEL[e.type], ref: e }));

  paletteItems = paletteItems.slice(0, 30);
  if (paletteIdx >= paletteItems.length) paletteIdx = 0;
  if (!paletteItems.length) {
    host.innerHTML = `<div class="palette-empty">Ничего не нашлось. Проверьте слово или добавьте свою запись в справочнике.</div>`;
    return;
  }
  host.innerHTML = paletteItems.map((it, i) => `<button class="p-result ${i === paletteIdx ? "is-active" : ""}" type="button" data-act="palette-pick" data-i="${i}">
    <div><div class="nm">${mark(it.name)}</div><div class="sub">${esc(it.sub || "")}</div></div>
    <span class="ty">${it.kind === "ref" ? TYPE_LABEL[it.ref.type] : it.kind === "char" ? "Герой" : it.kind === "note" ? "Заметка" : "Раздел"}</span>
  </button>`).join("");
}
function palettePick(i) {
  const it = paletteItems[i];
  if (!it) return;
  paletteClose();
  if (it.kind === "tab") go(it.tab);
  else if (it.kind === "char") { go("chars"); openCharSheet(it.id); }
  else if (it.kind === "note") { state.ui.noteId = it.id; go("notes"); }
  else if (it.kind === "ref") {
    if (it.ref.type === "custom") { state.ui.refSel = refKey(it.ref); go("ref"); }
    else { go("ref"); state.ui.refSel = refKey(it.ref); state.ui.refQuery = ""; render(); }
  }
}
reg("palette-pick", (btn) => palettePick(Number(btn.dataset.i)));

function initPalette() {
  const inp = $("#paletteInput");
  if (!inp) return;
  inp.addEventListener("input", () => { paletteIdx = 0; renderPalette(inp.value); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteIdx = Math.min(paletteItems.length - 1, paletteIdx + 1); renderPalette(inp.value); }
    else if (e.key === "ArrowUp") { e.preventDefault(); paletteIdx = Math.max(0, paletteIdx - 1); renderPalette(inp.value); }
    else if (e.key === "Enter") { e.preventDefault(); palettePick(paletteIdx); }
    else if (e.key === "Escape") { paletteClose(); }
  });
}
</script>
<script>/* ================= Трекер боя ================= */

function parseCustomMonster(rec) {
  const actions = (rec.text || "").split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
    const m = l.match(/^(.+?):(.*)$/);
    return m ? { n: m[1].trim().rstrip("."), d: m[2].trim() } : { n: "Действие", d: l };
  });
  return {
    id: rec.id, name: rec.name, lvl: rec.lvl || "1", hp: rec.hp || 1,
    armor: rec.armor || "none", speed: rec.speed || 6, mode: "ходьба",
    size: rec.size || "Средний", minion: false, kind: rec.group || "Свои существа",
    actions, special: []
  };
}
function findMonsterAny(name) {
  const lib = DATA.monsters.find((m) => m.name === name);
  if (lib) return lib;
  const custom = (state.custom || []).find((c) => c.kind === "monster" && c.name === name);
  return custom ? parseCustomMonster(custom) : null;
}

function addCharToCombat(ch, init) {
  if (state.combat.combatants.some((c) => c.charId === ch.id)) {
    toast("Этот герой уже в бою", "warn");
    return state.combat.combatants.find((c) => c.charId === ch.id);
  }
  const roll = init != null ? init : rollFormula("1d20+" + (Number(ch.dex) || 0)).total;
  const c = {
    id: uid(), name: ch.name, init: roll, hp: Number(ch.hp) || 0, maxHp: Number(ch.maxHp) || 0,
    armorValue: armorOf(ch), armorText: "Броня " + armorOf(ch),
    isHero: true, charId: ch.id, conditions: (ch.conditions || []).slice(),
    actions: 3, maxActions: 3, reaction: false,
    wounds: Number(ch.wounds) || 0, maxWounds: Number(ch.maxWounds) || 6
  };
  state.combat.combatants.push(c);
  state.combat.active = true;
  if (!state.combat.started) state.combat.started = Date.now();
  sortCombatants();
  save();
  render();
  return c;
}

function addMonsterToCombat(m, count = 1, init) {
  const armorText = m.armor === "medium" ? "Средняя броня" : m.armor === "heavy" ? "Тяжёлая броня" : "Без брони";
  for (let i = 0; i < count; i++) {
    const hp = m.hp || 1;
    const c = {
      id: uid(), name: count > 1 ? `${m.name} ${i + 1}` : m.name,
      init: init != null ? init : rollFormula("1d20").total,
      hp, maxHp: hp, armorValue: 0, armorText,
      isHero: false, monster: m.name, level: m.lvl,
      conditions: [], actions: 3, maxActions: 3, reaction: false, wounds: 0, maxWounds: 0
    };
    state.combat.combatants.push(c);
  }
  state.combat.active = true;
  if (!state.combat.started) state.combat.started = Date.now();
  sortCombatants();
  save();
  render();
}

function combatRow(c, idx) {
  const cur = state.combat.active && state.combat.turn === idx;
  const max = Number(c.maxHp) || 1;
  const pct = Math.max(0, Math.round(((Number(c.hp) || 0) / max) * 100));
  const dead = Number(c.hp) <= 0;
  return `<div class="combatant ${cur ? "is-current" : ""} ${dead ? "is-down" : ""}" data-id="${c.id}">
    <div class="init">${c.init ?? "—"}</div>
    <div>
      <div class="cname"><b>${esc(c.name)}</b>
        ${c.isHero ? `<span class="tag amber">герой</span>` : `<span class="tag">${esc(c.level ? "ур. " + c.level : "монстр")}</span>`}
        ${dead ? `<span class="tag red">повержен</span>` : ""}
        ${cur ? `<span class="tag green">ходит</span>` : ""}
      </div>
      <div class="cstats">
        <span>${c.hp} / ${c.maxHp} хит</span>
        <span class="armor">${esc(c.armorText || "")}</span>
        ${c.isHero ? `<span>${c.wounds}/${c.maxWounds} ран</span>` : ""}
      </div>
      <div class="cbar"><div class="hp-bar"><div class="hp-fill ${hpClass(c.hp, c.maxHp)}" style="width:${pct}%"></div></div></div>
      <div class="conds">
        ${(c.conditions || []).map((x) => `<button class="cond-chip" type="button" data-act="combat-cond-remove" data-id="${c.id}" data-name="${esc(x)}" title="Снять состояние">${esc(x)}</button>`).join("")}
        <select class="cond-add" data-act="combat-cond-add" data-id="${c.id}" aria-label="Добавить состояние">
          <option value="">＋ состояние</option>
          ${DATA.conditions.map((x) => `<option>${esc(x.name)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="cside">
      <div class="row" style="gap:4px;justify-content:flex-end">
        <div class="actions-pips" title="Действия в этом ходу">
          ${Array.from({ length: c.maxActions || 3 }, (_, i) => `<button class="apip ${i < (c.actions ?? 3) ? "on" : ""}" type="button" data-act="combat-action" data-id="${c.id}" data-i="${i}" aria-label="Действие ${i + 1}"></button>`).join("")}
        </div>
        <button class="btn btn-sm ${c.reaction ? "btn-danger" : ""}" type="button" data-act="combat-reaction" data-id="${c.id}" title="Реакция (1/раунд)">Реакция</button>
      </div>
      <div class="hp-quick">
        <input type="number" id="dmg-${c.id}" placeholder="урон" min="0" aria-label="Урон">
        <label class="check small" title="Реакция «Защита»: снизить урон на броню"><input type="checkbox" id="def-${c.id}">Защита</label>
        <button class="btn btn-sm" type="button" data-act="combat-damage" data-id="${c.id}">−</button>
        <button class="btn btn-sm" type="button" data-act="combat-heal" data-id="${c.id}">+</button>
      </div>
      <div class="row" style="gap:2px;justify-content:flex-end;margin-top:2px">
        ${c.isHero ? `<button class="btn btn-sm" type="button" data-act="combat-wound" data-id="${c.id}">＋рана</button>` : ""}
        <button class="icon-btn sm danger" type="button" data-act="combat-remove" data-id="${c.id}" title="Убрать из боя"><svg class="ico"><use href="#i-trash"/></svg></button>
      </div>
    </div>
  </div>`;
}

function combatSetup() {
  return `<section class="card">
    <div class="card-head"><h2>Собрать бой</h2><span class="count">инициатива = d20 + ЛВК</span></div>
    <div class="card-body">
      <p class="muted small" style="margin-top:0">Добавьте героев и монстров, затем бросьте инициативу. Порядок меняется вручную — просто поправьте число.</p>
      <div class="combat-setup">
        <div>
          <div class="subhead">Партия</div>
          ${state.chars.length ? `<div class="stack" style="gap:6px">${state.chars.map((ch) => `<div class="row" style="justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:9px">
            <div><div>${esc(ch.name)}</div><div class="small dim">${esc(charSummary(ch))}</div></div>
            <button class="btn btn-sm" type="button" data-act="combat-add-char" data-id="${ch.id}">＋</button>
          </div>`).join("")}</div>` : `<p class="small dim">Героев нет. <button class="btn btn-sm" type="button" data-act="new-char">Создать</button></p>`}
        </div>
        <div>
          <div class="subhead">Бестиарий</div>
          <div class="searchbar"><svg class="ico"><use href="#i-search"/></svg><input type="search" id="combatMonsterSearch" aria-label="Поиск существа в бестиарии" placeholder="Гоблин, тролль, нежить…"></div>
          <div id="combatMonsterList" class="stack" style="gap:5px;margin-top:8px;max-height:280px;overflow:auto"></div>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-primary" type="button" data-act="combat-roll-all">Бросить инициативу и начать</button>
        <button class="btn" type="button" data-act="combat-add">Участник вручную</button>
      </div>
    </div>
  </section>`;
}

function combatView() {
  const c = state.combat;
  const cur = currentCombatant();
  return `<div class="page-head">
    <div><p class="eyebrow">Инициатива</p><h1 class="page-title">Бой</h1>
      <p class="page-sub">3 действия и 1 реакция на героя. Урон вводится цифрой; «Защита» снижает его на броню.</p></div>
    <div class="head-actions">
      ${c.active ? `<button class="btn" type="button" data-act="combat-add"><svg class="ico"><use href="#i-plus"/></svg>Участник</button>
      <button class="btn btn-primary" type="button" data-act="combat-next">Следующий ход<svg class="ico"><use href="#i-chevron"/></svg></button>` : ""}
    </div>
  </div>
  ${!c.combatants.length ? combatSetup() : `
  <section class="card">
    <div class="combat-toolbar">
      <div class="round"><b>${c.round}</b><span>раунд</span></div>
      <div class="row" style="gap:6px">
        <button class="btn btn-sm" type="button" data-act="combat-prev">←</button>
        <button class="btn btn-sm btn-primary" type="button" data-act="combat-next">Следующий →</button>
      </div>
      ${cur ? `<div class="grow small dim" style="margin-left:6px">Ходит: <b style="color:var(--amber-soft)">${esc(cur.name)}</b></div>` : `<div class="grow"></div>`}
      <button class="btn btn-sm" type="button" data-act="combat-add">＋</button>
      <button class="btn btn-sm btn-danger" type="button" data-act="combat-stop">Завершить</button>
    </div>
    <div class="combat-list">
      ${c.combatants.length ? c.combatants.map(combatRow).join("") : `<div class="empty" style="padding:26px"><p>В бою пока никого.</p><button class="btn btn-sm" type="button" data-act="combat-add">Добавить участника</button></div>`}
    </div>
    <div class="card-body" style="border-top:1px solid var(--line)">
      <p class="hint mb-0">Порядок: клик по числу инициативы — изменить. Криты игнорируют броню, поэтому при крите не отмечайте «Защиту».</p>
    </div>
  </section>`}`;
}
registerView("combat", combatView);

onBind("combat", () => {
  const inp = $("#combatMonsterSearch");
  if (inp) {
    const draw = () => {
      const q = inp.value;
      const list = searchRefs(q, "monster").slice(0, 40);
      $("#combatMonsterList").innerHTML = list.map((e) => `<div class="row" style="justify-content:space-between;padding:6px 9px;border:1px solid var(--line);border-radius:8px">
        <button class="grow" type="button" style="background:none;border:0;color:inherit;text-align:left;padding:0" data-act="combat-add-monster" data-name="${esc(e.name)}">
          <div class="small">${esc(e.name)}</div><div class="small dim">ур. ${esc(e.raw.lvl)} · ${e.raw.hp ? e.raw.hp + " хит" : "миньон"}</div>
        </button>
        <button class="btn btn-sm" type="button" data-act="combat-add-monster" data-name="${esc(e.name)}">＋</button>
      </div>`).join("") || `<p class="small dim">Не найдено.</p>`;
    };
    draw();
    inp.addEventListener("input", draw);
  }
  $$("[data-act='combat-cond-add']").forEach((sel) => sel.addEventListener("change", () => {
    if (!sel.value) return;
    const c = state.combat.combatants.find((x) => x.id === sel.dataset.id);
    if (!c) return;
    c.conditions = c.conditions || [];
    if (!c.conditions.includes(sel.value)) c.conditions.push(sel.value);
    save(); render();
  }));
});

/* ---------------- Combat actions ---------------- */
reg("combat-new", () => {
  if (state.combat.combatants.length && !confirm("Начать новый бой? Текущий список участников будет очищен.")) return;
  state.combat = { active: true, round: 1, turn: 0, combatants: [], started: Date.now() };
  save();
  go("combat");
});
reg("combat-add-char", (btn) => { const ch = charById(btn.dataset.id); if (ch) addCharToCombat(ch); });
reg("combat-add-monster", (btn) => {
  const m = DATA.monsters.find((x) => x.name === btn.dataset.name);
  if (!m) return;
  addMonsterToCombat(m, 1);
  toast("В бою: " + esc(m.name));
});
reg("combat-add", () => combatAddModal());
function combatAddModal() {
  const available = state.chars.filter((ch) => !state.combat.combatants.some((c) => c.charId === ch.id));
  openModal({
    title: "Добавить участника",
    body: `<div class="stack">
      <div class="field"><label for="caName">Имя</label><input id="caName" type="text" placeholder="Стражник, тень, босс…"></div>
      <div class="field-row">
        <div class="field"><label for="caInit">Инициатива</label><input id="caInit" type="number" placeholder="авто" ></div>
        <div class="field"><label for="caHp">Хиты</label><input id="caHp" type="number" value="10"></div>
        <div class="field"><label for="caArmor">Броня</label><input id="caArmor" type="number" value="0"></div>
      </div>
      ${available.length ? `<div><div class="subhead">Из партии</div><div class="chips">${available.map((ch) => `<button class="chip" type="button" data-act="combat-add-char" data-id="${ch.id}">${esc(ch.name)}</button>`).join("")}</div></div>` : ""}
      <p class="hint">Броня — число для реакции «Защита». Монстра с особенностями лучше добавить из справочника.</p>
    </div>`,
    footer: `<button class="btn" type="button" data-close-modal>Отмена</button><span class="spacer"></span><button class="btn btn-primary" type="button" data-act="combat-add-custom">Добавить</button>`
  });
}
reg("combat-add-custom", () => {
  const name = $("#caName").value.trim() || "Безымянный";
  const hp = Math.max(0, Number($("#caHp").value) || 0);
  const armor = Math.max(0, Number($("#caArmor").value) || 0);
  const initRaw = $("#caInit").value;
  const init = initRaw === "" ? rollFormula("1d20").total : Number(initRaw) || 0;
  state.combat.combatants.push({
    id: uid(), name, init, hp, maxHp: hp, armorValue: armor, armorText: armor ? "Броня " + armor : "Без брони",
    isHero: false, conditions: [], actions: 3, maxActions: 3, reaction: false, wounds: 0, maxWounds: 0
  });
  state.combat.active = true;
  sortCombatants(); save(); closeModal(); render();
});
reg("combat-roll-all", () => {
  state.combat.combatants.forEach((c) => { c.init = rollFormula("1d20" + (c.isHero ? "+" + (charById(c.charId)?.dex || 0) : "")).total; });
  state.combat.active = true;
  state.combat.round = 1; state.combat.turn = 0;
  sortCombatants(); save(); render();
  toast("Инициатива брошена");
});
reg("combat-next", () => {
  const list = state.combat.combatants;
  if (!list.length) return;
  let guard = 0;
  do {
    state.combat.turn++;
    if (state.combat.turn >= list.length) {
      state.combat.turn = 0;
      state.combat.round = (state.combat.round || 1) + 1;
      list.forEach((c) => { c.actions = c.maxActions || 3; c.reaction = false; });
    }
    guard++;
  } while (list[state.combat.turn] && list[state.combat.turn].hp <= 0 && guard < list.length + 1);
  const cur = list[state.combat.turn];
  if (cur) cur.actions = cur.maxActions || 3;
  state.combat.active = true;
  save(); render();
  checkRoundReminders();
});
reg("combat-prev", () => {
  const list = state.combat.combatants;
  if (!list.length) return;
  state.combat.turn--;
  if (state.combat.turn < 0) {
    state.combat.turn = Math.max(0, list.length - 1);
    state.combat.round = Math.max(1, (state.combat.round || 1) - 1);
  }
  save(); render();
});
reg("combat-stop", () => {
  if (!confirm("Завершить бой и очистить список участников?")) return;
  state.combat = { active: false, round: 1, turn: 0, combatants: [], started: null };
  save(); render();
  toast("Бой завершён");
});
reg("combat-remove", (btn) => {
  state.combat.combatants = state.combat.combatants.filter((c) => c.id !== btn.dataset.id);
  if (state.combat.turn >= state.combat.combatants.length) state.combat.turn = Math.max(0, state.combat.combatants.length - 1);
  save(); render();
});
reg("combat-action", (btn) => {
  const c = state.combat.combatants.find((x) => x.id === btn.dataset.id);
  if (!c) return;
  const i = Number(btn.dataset.i);
  c.actions = i < (c.actions ?? 3) ? i : i + 1;
  save(); render();
});
reg("combat-reaction", (btn) => {
  const c = state.combat.combatants.find((x) => x.id === btn.dataset.id);
  if (!c) return;
  c.reaction = !c.reaction;
  save(); render();
});
reg("combat-damage", (btn) => {
  const c = state.combat.combatants.find((x) => x.id === btn.dataset.id);
  if (!c) return;
  const input = $("#dmg-" + c.id);
  let amount = Math.max(0, Number(input?.value) || 0);
  if (!amount) { toast("Введите урон", "warn"); return; }
  const defend = !!$("#def-" + c.id)?.checked;
  if (defend && c.armorValue) amount = Math.max(0, amount - c.armorValue);
  const wasDown = c.hp <= 0;
  c.hp = Math.max(0, c.hp - amount);
  if (c.hp === 0) {
    if (!c.conditions.includes("При смерти")) c.conditions.push("При смерти");
    if (c.isHero) {
      const ch = charById(c.charId);
      if (wasDown) { c.wounds = Math.min(c.maxWounds, c.wounds + 2); if (ch) ch.wounds = c.wounds; }
    }
  }
  if (c.isHero) {
    const ch = charById(c.charId);
    if (ch) { ch.hp = c.hp; ch.wounds = c.wounds; ch.conditions = c.conditions.slice(); }
  }
  save(); render();
  toast(`${esc(c.name)}: −${amount}${defend && c.armorValue ? " (броня " + c.armorValue + ")" : ""} → ${c.hp} хит`);
});
reg("combat-heal", (btn) => {
  const c = state.combat.combatants.find((x) => x.id === btn.dataset.id);
  if (!c) return;
  const amount = Math.max(0, Number($("#dmg-" + c.id)?.value) || 0);
  if (!amount) { toast("Введите число лечения", "warn"); return; }
  c.hp = Math.min(c.maxHp || c.hp + amount, c.hp + amount);
  if (c.hp > 0) c.conditions = c.conditions.filter((x) => x !== "При смерти");
  if (c.isHero) {
    const ch = charById(c.charId);
    if (ch) { ch.hp = c.hp; ch.conditions = c.conditions.slice(); }
  }
  save(); render();
  toast(`${esc(c.name)}: +${amount} → ${c.hp} хит`);
});
reg("combat-wound", (btn) => {
  const c = state.combat.combatants.find((x) => x.id === btn.dataset.id);
  if (!c) return;
  c.wounds = Math.min(c.maxWounds, c.wounds + 1);
  const ch = charById(c.charId);
  if (ch) ch.wounds = c.wounds;
  save(); render();
  if (c.wounds >= c.maxWounds) toast(`${esc(c.name)} получает смертельную рану!`, "warn");
});
reg("combat-cond-remove", (btn) => {

<script>/* ================= Напоминания ================= */

function remindersView() {

function reminderForm(existing, presetMode) {

  const localDate = (ts) => {
    const d = ts ? new Date(ts) : new Date(Date.now() + 30 * 60000);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

    footer: `<button class="btn" type="button" data-close-modal>Отмена</button><span class="spacer"></span><button class="btn btn-primary" type="button" data-act="rem-save" data-id="${existing ? existing.id : ""}" data-mode="${r.mode}">Сохранить</button>`

let remDraftMode = "time";
reg("rem-new", () => { remDraftMode = "time"; reminderForm(null, "time"); });
reg("rem-mode", (btn) => {

reg("rem-save", (btn) => {

  const dueVal = $("#remDue")?.value;

  };

});
reg("rem-template", (btn) => {

});
reg("rem-done", (btn) => {

});
reg("rem-delete", (btn) => {

});
reg("rem-edit", (btn) => {

  });

function checkRoundReminders() {

/* ================= Заметки ================= */

function noteExcerpt(n) { return (n.plain || "").replace(/\s+/g, " ").trim().slice(0, 80); }

function notesView() {
  const sorted = state.notes.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0));

  const filtered = q ? sorted.filter((n) => norm((n.title || "") + " " + (n.plain || "")).includes(q)) : sorted;

registerView("notes", notesView);

function countWords(text) {
  const t = String(text || "").trim();
  if (!t) return "0 слов";
  const n = t.split(/\s+/).length;
  return n + " " + plural(n, "слово", "слова", "слов");
}

let noteSaveTimer = null;
function saveNoteFromDom() {
  const note = noteById(state.ui.noteId);
  const body = $("#noteBody");
  const titleEl = $("#noteTitle");
  if (!note || !body) return;
  note.html = body.innerHTML;
  note.plain = body.innerText || "";
  note.title = titleEl ? titleEl.value : note.title;
  note.updated = Date.now();
  const words = $("#noteWords");
  if (words) words.textContent = countWords(note.plain);
  const saved = $("#noteSaved");
  if (saved) saved.textContent = "сохранено " + fmtTimeShort(Date.now());
  save();
}
function scheduleNoteSave() {
  const saved = $("#noteSaved");
  if (saved) saved.textContent = "сохраняю…";
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(saveNoteFromDom, 600);
}

onBind("notes", () => {
  const body = $("#noteBody");
  const title = $("#noteTitle");
  const search = $("#noteSearch");
  if (search) {
    search.addEventListener("input", () => {
      state.ui.noteQuery = search.value;
      saveNoteFromDom();
      render();
      const again = $("#noteSearch");
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
  }
  if (body) {
    body.addEventListener("input", scheduleNoteSave);
    body.addEventListener("blur", saveNoteFromDom);
    body.addEventListener("paste", (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text);
    });
    body.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); document.execCommand("bold"); }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") { e.preventDefault(); document.execCommand("italic"); }
    });
  }
  if (title) title.addEventListener("input", scheduleNoteSave);

  $$("[data-cmd]").forEach((btn) => {
    btn.addEventListener("mousedown", (e) => e.preventDefault());
    btn.addEventListener("click", () => {
      const cmd = btn.dataset.cmd;
      const map = { h2: "formatBlock", h3: "formatBlock", p: "formatBlock", quote: "formatBlock", ul: "insertUnorderedList", ol: "insertOrderedList" };
      body?.focus();
      if (cmd === "h2") document.execCommand("formatBlock", false, "<h2>");
      else if (cmd === "h3") document.execCommand("formatBlock", false, "<h3>");
      else if (cmd === "p") document.execCommand("formatBlock", false, "<p>");
      else if (cmd === "quote") document.execCommand("formatBlock", false, "<blockquote>");
      else if (cmd === "ul" || cmd === "ol") document.execCommand(map[cmd], false);
      else document.execCommand(cmd, false);
      scheduleNoteSave();
    });
  });
});

reg("new-note", () => {
  saveNoteFromDom();
  const note = { id: uid(), title: "", html: "", plain: "", created: Date.now(), updated: Date.now() };
  state.notes.push(note);
  state.ui.noteId = note.id;
  save(); go("notes");
  setTimeout(() => $("#noteTitle")?.focus(), 120);
});
reg("note-select", (btn) => {
  saveNoteFromDom();
  state.ui.noteId = btn.dataset.id;
  save(); render();
});
reg("open-note", (btn) => { state.ui.noteId = btn.dataset.id; go("notes"); });
reg("note-delete", (btn) => {
  const note = noteById(btn.dataset.id);
  if (!note) return;
  if (!confirm(`Удалить заметку «${note.title || "Без названия"}»?`)) return;
  state.notes = state.notes.filter((n) => n.id !== note.id);
  state.ui.noteId = state.notes[0]?.id || null;
  save(); render(); toast("Заметка удалена");
});
reg("note-download", (btn) => {
  const note = noteById(btn.dataset.id);
  if (!note) return;
  saveNoteFromDom();
  const md = `# ${note.title || "Заметка"}\n\n` + (note.plain || "");
  const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (note.title || "note").replace(/[\\/:*?"<>|]/g, "-") + ".md";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
</script>
<script>/* ================= Инициализация и системные действия ================= */
function exportData() {
  const payload = { app: "nimble-shirma", version: 1, exported: new Date().toISOString(), data: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nimble-shirma-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Файл с данными сохранён");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      const data = parsed && parsed.data ? parsed.data : parsed;
      if (!data || typeof data !== "object") throw new Error("пустой файл");
      if (!Array.isArray(data.chars) && !Array.isArray(data.notes) && !Array.isArray(data.reminders)) throw new Error("нет знакомых разделов");
      if (!confirm("Импорт заменит текущие персонажи, бой, напоминания и заметки. Продолжить?")) return;
      state = { ...defaultState(), ...data, ui: { ...defaultState().ui, ...(data.ui || {}) } };
      rebuildRefIndex();
      save(true);
      REF_INDEX = null;
      render();
      toast("Данные импортированы");
    } catch (e) {
      toast("Не удалось прочитать файл: " + esc(e.message), "warn");
    }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm("Удалить ВСЕ данные ширмы: героев, бой, напоминания и заметки? Отменить это будет нельзя.")) return;
  if (!confirm("Точно? Рекомендую сначала сделать экспорт.")) return;
  state = defaultState();
  REF_INDEX = null;
  save(true);
  closeModal(); closeDrawer(); paletteClose();
  render();
  toast("Всё сброшено");
}

reg("export-data", () => exportData());
reg("import-data", () => $("#importFile").click());
reg("print-screen", () => window.print());
reg("reset-data", () => resetAll());

function initShell() {
  document.addEventListener("click", (e) => {
    const closer = e.target.closest("[data-close-modal]");
    if (closer) { closeModal(); return; }
    const dcloser = e.target.closest("[data-close-drawer]");
    if (dcloser) { closeDrawer(); return; }
    const pcloser = e.target.closest("[data-close-palette]");
    if (pcloser) { paletteClose(); return; }
    const act = e.target.closest("[data-act]");
    if (act) {
      const fn = ACTIONS[act.dataset.act];
      if (fn) { e.preventDefault(); fn(act, e); return; }
    }
  });

  $$("#tabs .tab").forEach((tab) => tab.addEventListener("click", () => go(tab.dataset.tab)));

  const menuBtn = $("#dataMenuBtn");
  const menu = $("#dataMenu");
  if (menuBtn && menu) {
    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = menu.hidden;
      menu.hidden = !open;
      menuBtn.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu-wrap")) { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
    });
    menu.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      menu.hidden = true;
      menuBtn.setAttribute("aria-expanded", "false");
      const map = { export: "export-data", import: "import-data", print: "print-screen", reset: "reset-data" };
      ACTIONS[map[btn.dataset.action]]?.();
    });
  }

  const searchTrigger = $("#searchTrigger");
  if (searchTrigger) searchTrigger.addEventListener("click", () => paletteOpen());
  const quick = $("#quickD20");
  if (quick) quick.addEventListener("click", () => {
    const res = rollFormula("1d20");
    pushRoll("d20", res);
    toast(`<b>d20:</b> ${res.total}<br><span class="dim mono small">${esc(res.detail)}</span>`);
    if (state.ui.tab === "dice" || state.ui.tab === "screen") render();
  });

  const file = $("#importFile");
  if (file) file.addEventListener("change", () => { if (file.files[0]) importData(file.files[0]); file.value = ""; });

  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
    if (e.key === "Escape") {
      if (!$("#palette").hidden) paletteClose();
      else if (!$("#modalRoot").hidden) closeModal();
      else if (!$("#drawer").hidden) closeDrawer();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if ($("#palette").hidden) paletteOpen(); else paletteClose();
      return;
    }
    if (!typing && e.key === "/") { e.preventDefault(); paletteOpen(); }
  });

  window.addEventListener("resize", () => { if (state.ui.tab === "screen") render(); });

  initPalette();
  render();
  updateBadges();
  setTimeout(checkReminderAlerts, 1200);
  setInterval(updateBadges, 20000);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initShell);
else initShell();
</script>
</body>
</html>
