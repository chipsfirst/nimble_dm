<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimble — ширма мастера</title>
<meta name="description" content="Ширма мастера для Nimble RPG: персонажи, броски, справочник, бестиарий, трекер боя, напоминания и заметки.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-screen" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM4 9h16M9.5 9v10"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.7-3.7 3.6-5.8 7.2-5.8s6.5 2.1 7.2 5.8"/></symbol>
  <symbol id="i-d20" viewBox="0 0 24 24"><path d="M12 2.6 21 8v8l-9 5.4L3 16V8z"/><path d="m12 2.6 4 7.4H8zM3 8l5 2.6L6.4 16zM21 8l-5 2.6L17.6 16zM12 21.4V13.6l4.4 2.4zM12 21.4 7.6 16 12 13.6z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.2C4 4 5 3 6.2 3H19v15.4H6.2C5 18.4 4 19.4 4 20.6zM4 20.6C4 21.5 5 22 6 22h13"/><path d="M8 7h7M8 10.5h7"/></symbol>
  <symbol id="i-swords" viewBox="0 0 24 24"><path d="m4 20 6-6M4 20H2.6v-1.4L13 8.2M14.6 3.4 20 3l-.4 5.4-8.2 8.2-4-4z"/><path d="m14 10 4 4M9.6 14.4l-4 4M4 20l-1.4-1.4"/><path d="m9 6 9 9M15 3l6 6"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.6 5.4 2 6H4c.4-.6 2-2 2-6z"/><path d="M10 18a2.2 2.2 0 0 0 4 0"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5M8.5 12h7M8.5 15.5h7M8.5 8.5H11"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.6 4.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM14 5l3.5 3.5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.6 7.9-8 9-4.4-1.1-8-4-8-9V6z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20S4 14.6 4 9.4A4.4 4.4 0 0 1 12 6a4.4 4.4 0 0 1 8 3.4C20 14.6 12 20 12 20z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-8 12h6l-1 8 9-13h-6z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M20 3 36 12v16L20 37 4 28V12z"/><path d="m20 10 8 4.5v9L20 28l-8-4.5v-9z"/></svg>
      </span>
      <span class="brand-text">
        <strong>Nimble</strong>
        <em>ширма мастера</em>
      </span>
    </div>

    <button class="search-trigger" id="searchTrigger" type="button">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <span>Найти правило, предмет, существо…</span>
      <kbd>⌘K</kbd>
    </button>

    <div class="top-actions">
      <button class="btn btn-quiet" id="quickD20" type="button" title="Быстрый d20">
        <svg class="ico" aria-hidden="true"><use href="#i-d20"/></svg>
        <span>d20</span>
      </button>
      <div class="menu-wrap">
        <button class="icon-btn" id="dataMenuBtn" type="button" aria-label="Данные и настройки" aria-expanded="false">
          <svg class="ico" aria-hidden="true"><use href="#i-dots"/></svg>
        </button>
        <div class="menu" id="dataMenu" hidden>
          <button type="button" data-action="export">Экспорт всех данных</button>
          <button type="button" data-action="import">Импорт из файла</button>
          <button type="button" data-action="print">Печать ширмы</button>
          <hr>
          <button type="button" class="danger" data-action="reset">Сбросить всё</button>
          <p class="menu-hint">Данные хранятся только в этом браузере.</p>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Разделы ширмы">
    <button class="tab is-active" data-tab="screen" type="button"><svg class="ico" aria-hidden="true"><use href="#i-screen"/></svg><span>Ширма</span></button>
    <button class="tab" data-tab="chars" type="button"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg><span>Персонажи</span></button>
    <button class="tab" data-tab="dice" type="button"><svg class="ico" aria-hidden="true"><use href="#i-d20"/></svg><span>Кубики</span></button>
    <button class="tab" data-tab="ref" type="button"><svg class="ico" aria-hidden="true"><use href="#i-book"/></svg><span>Справочник</span></button>
    <button class="tab" data-tab="combat" type="button"><svg class="ico" aria-hidden="true"><use href="#i-swords"/></svg><span>Бой</span><span class="tab-badge" id="combatBadge" hidden></span></button>
    <button class="tab" data-tab="reminders" type="button"><svg class="ico" aria-hidden="true"><use href="#i-bell"/></svg><span>Напоминания</span><span class="tab-badge" id="remBadge" hidden></span></button>
    <button class="tab" data-tab="notes" type="button"><svg class="ico" aria-hidden="true"><use href="#i-note"/></svg><span>Заметки</span></button>
  </nav>

  <main class="view" id="view"></main>

  <footer class="footer">
    <span>Данные: Nimble Vault RU · Nimble RPG © Nimble Co. Неофициальный перевод для личного использования.</span>
    <span id="saveState">Автосохранение включено</span>
  </footer>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close-drawer></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="icon-btn drawer-close" type="button" aria-label="Закрыть" data-close-drawer><svg class="ico" aria-hidden="true"><use href="#i-close"/></svg></button>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>

<div class="modal-root" id="modalRoot" hidden></div>

<div class="palette" id="palette" hidden>
  <div class="palette-scrim" data-close-palette></div>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Поиск по ширме">
    <div class="palette-input">
      <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="paletteInput" type="search" aria-label="Поиск по ширме" placeholder="Правило, предмет, существо, заклинание, заметка…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="palette-results" id="paletteResults"></div>
    <div class="palette-foot"><span>↑↓ — выбор</span><span>Enter — открыть</span><span>Esc — закрыть</span></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="data-ru.js"></script>
<script src="app-core.js"></script>
<script src="app-screen.js"></script>
<script src="app-chars.js"></script>
<script src="app-ref.js"></script>
<script src="app-combat.js"></script>
<script src="app-extra.js"></script>
<script src="app-init.js"></script>
</body>
</html>
